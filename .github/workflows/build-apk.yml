name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci --prefer-offline --no-audit --no-fund

    - name: Set versionCode auto
      run: |
        VERSION_CODE=$(date +%Y%m%d)$(printf "%02d" $((GITHUB_RUN_NUMBER % 100)))
        VERSION_NAME="2.$(date +%Y%m%d)"
        echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
        echo "BUILD_DATE=$(date '+%d/%m/%Y %H:%M')" >> $GITHUB_ENV
        echo "BUILD_ID=$(date +%Y%m%d-%H%M)-run${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

    - name: Copy web files to www/
      run: |
        mkdir -p www
        if [ ! -f capacitor.config.json ]; then
          echo '{"appId":"com.famille.dieulgandet.app","appName":"FamilyHub","webDir":"www","android":{"allowMixedContent":true,"webContentsDebuggingEnabled":false},"plugins":{"SplashScreen":{"launchShowDuration":0}}}' > capacitor.config.json
        fi
        
        for file in index.html manifest.json sw.js firebaseSync.js storage.js; do
          cp -f "$file" www/ 2>/dev/null || true
        done
        
        for dir in icons locker-tracker todo-partage cave-spiritueux menus-semaine liste-courses; do
          cp -rf "$dir/" www/ 2>/dev/null || true
        done

        if [ -f www/index.html ]; then
          sed -i "s|__BUILD_DATE__|${BUILD_DATE:-unknown}|g" www/index.html
          sed -i "s|__BUILD_ID__|${BUILD_ID:-unknown}|g" www/index.html
          sed -i "s|__VERSION_NAME__|${VERSION_NAME:-unknown}|g" www/index.html
        fi

    - name: Ensure Android platform exists
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        else
          echo "Android platform already present"
        fi

    - name: Capacitor sync
      run: npx cap sync android

    # L'étape Java est déplacée ici, maintenant que le dossier android/ existe !
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Copy SmsPlugin Java files
      run: |
        PLUGIN_DIR="android/app/src/main/java/com/famille/dieulgandet"
        mkdir -p "$PLUGIN_DIR"
        cp android-src/SmsPlugin.java "$PLUGIN_DIR/SmsPlugin.java"
        cp android-src/MainActivity.java "$PLUGIN_DIR/MainActivity.java"

    - name: Add SMS permissions in AndroidManifest (XML-safe)
      run: |
        python3 - << 'PYEOF'
        import xml.etree.ElementTree as ET
        from xml.dom import minidom

        manifest_path = "android/app/src/main/AndroidManifest.xml"
        tree = ET.parse(manifest_path)
        root = tree.getroot()

        ANDROID_NS = "http://schemas.android.com/apk/res/android"
        ET.register_namespace('android', ANDROID_NS)

        def has_permission(root, perm_name):
            android_name = f"{{{ANDROID_NS}}}name"
            for uses_perm in root.findall("uses-permission"):
                if uses_perm.get(android_name) == perm_name:
                    return True
            return False

        permissions = [
            "android.permission.READ_SMS",
            "android.permission.RECEIVE_SMS",
            "android.permission.INTERNET",
            "android.permission.ACCESS_NETWORK_STATE",
        ]

        android_name_attr = f"{{{ANDROID_NS}}}name"
        for perm in permissions:
            if not has_permission(root, perm):
                uses_perm = ET.Element("uses-permission")
                uses_perm.set(android_name_attr, perm)
                root.insert(0, uses_perm)

        xml_bytes = ET.tostring(root, encoding="utf-8")
        pretty = minidom.parseString(xml_bytes).toprettyxml(indent=" ")
        with open(manifest_path, "w", encoding="utf-8") as f:
            f.write(pretty)
        print("✓ Permissions injectées avec succès")
        PYEOF

    - name: Setup keystore stable (KEYSTORE_BASE64 secret)
      run: |
        KEYSTORE_DIR="$HOME/.android"
        mkdir -p "$KEYSTORE_DIR"
        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$HOME/.android/debug.keystore"
          echo "✓ Keystore restauré avec succès"
        else
          echo "❌ Erreur : Le secret KEYSTORE_BASE64 est manquant dans les paramètres du dépôt"
          exit 1
        fi

    - name: Inject configurations in build.gradle (Direct replacement)
      run: |
        python3 - << 'PYEOF'
        import re, os

        path = "android/app/build.gradle"
        with open(path, encoding="utf-8") as f:
            content = f.read()

        vc = os.environ.get("VERSION_CODE", "10000")
        vn = os.environ.get("VERSION_NAME", "2.0")

        content = re.sub(r"versionCode\s+\d+", f"versionCode {vc}", content)
        content = re.sub(r'versionName\s+"[^"]+"', f'versionName "{vn}"', content)
        content = re.sub(r'applicationId\s+"[^"]+"', 'applicationId "com.famille.dieulgandet.app"', content)

        with open(path, "w", encoding="utf-8") as f:
            f.write(content)
        print(f"✓ Configuration définitive injectée : Code={vc}, Nom={vn}, ID=com.famille.dieulgandet.app")
        PYEOF

    - name: Fix gradlew permissions
      run: chmod +x android/gradlew

    - name: Build APK
      run: |
        cd android
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FamilyHub-v${{ github.run_number }}-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        
