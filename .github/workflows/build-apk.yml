name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '24'

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          node_modules
        key: ${{ runner.os }}-gradle-node-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-gradle-node-

    - name: Install Capacitor 8
      run: |
        npm install @capacitor/core@8.0.0 @capacitor/cli@8.0.0 @capacitor/android@8.0.0 --no-audit --no-fund --prefer-offline

    # Définir versionCode / versionName + infos de build
    - name: Set versionCode auto
      run: |
        VERSION_CODE=$(date +%Y%m%d)$(printf "%02d" $((GITHUB_RUN_NUMBER % 100)))
        VERSION_NAME="2.$(date +%Y%m%d)"
        echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

        BUILD_DATE=$(date '+%d/%m/%Y %H:%M')
        echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

        BUILD_ID=$(date +%Y%m%d-%H%M)-run${GITHUB_RUN_NUMBER}
        echo "BUILD_ID=$BUILD_ID" >> $GITHUB_ENV

    - name: Copy web files to www/
      run: |
        mkdir -p www
        if [ ! -f capacitor.config.json ]; then
          echo '{"appId":"com.famille.dieulgandet","appName":"FamilyHub","webDir":"www","android":{"allowMixedContent":true,"webContentsDebuggingEnabled":false},"plugins":{"SplashScreen":{"launchShowDuration":0}}}' > capacitor.config.json
        fi
        cp -f index.html www/ 2>/dev/null || true
        cp -f manifest.json www/ 2>/dev/null || true
        cp -f sw.js www/ 2>/dev/null || true
        cp -rf icons/ www/ 2>/dev/null || true
        cp -rf locker-tracker/ www/ 2>/dev/null || true
        cp -rf todo-partage/ www/ 2>/dev/null || true
        cp -rf cave-spiritueux/ www/ 2>/dev/null || true
        cp -rf menus-semaine/ www/ 2>/dev/null || true
        cp -rf liste-courses/ www/ 2>/dev/null || true
        if [ -f www/index.html ]; then
          # Utilisation de | comme délimiteur pour éviter les conflits avec / dans BUILD_DATE
          sed -i "s|__BUILD_DATE__|${BUILD_DATE:-unknown}|g" www/index.html
          sed -i "s|__BUILD_ID__|${BUILD_ID:-unknown}|g" www/index.html
          sed -i "s|__VERSION_NAME__|${VERSION_NAME:-unknown}|g" www/index.html
        fi

    - name: Debug index.html après injection
      run: |
        echo "===== BUILD_DATE=$BUILD_DATE ====="
        echo "===== BUILD_ID=$BUILD_ID ====="
        echo "===== VERSION_NAME=$VERSION_NAME ====="
        echo "===== Contenu de www/index.html ====="
        sed -n '1,260p' www/index.html || echo "www/index.html introuvable"

    - name: Ensure Android platform exists
      run: |
        if [ ! -d "android" ]; then
          echo "Android platform not found, adding with Capacitor..."
          npx cap add android
        else
          echo "Android platform already present, keeping local changes"
        fi

    - name: Capacitor sync
      run: |
        npx cap sync android

    - name: Copy SmsPlugin Java files
      run: |
        PLUGIN_DIR="android/app/src/main/java/com/famille/dieulgandet"
        mkdir -p "$PLUGIN_DIR"
        cp android-src/SmsPlugin.java "$PLUGIN_DIR/SmsPlugin.java"
        cp android-src/MainActivity.java "$PLUGIN_DIR/MainActivity.java"

    - name: Add SMS permissions in AndroidManifest (XML-safe)
      run: |
        python3 - << 'PYEOF'
        import xml.etree.ElementTree as ET
        from xml.dom import minidom

        manifest_path = "android/app/src/main/AndroidManifest.xml"

        tree = ET.parse(manifest_path)
        root = tree.getroot()

        ANDROID_NS = "http://schemas.android.com/apk/res/android"
        ET.register_namespace('android', ANDROID_NS)

        def has_permission(root, perm_name):
            android_name = f"{{{ANDROID_NS}}}name"
            for uses_perm in root.findall("uses-permission"):
                if uses_perm.get(android_name) == perm_name:
                    return True
            return False

        permissions = [
            "android.permission.READ_SMS",
            "android.permission.RECEIVE_SMS",
            "android.permission.INTERNET",
            "android.permission.ACCESS_NETWORK_STATE",
        ]

        android_name_attr = f"{{{ANDROID_NS}}}name"

        for perm in permissions:
            if not has_permission(root, perm):
                uses_perm = ET.Element("uses-permission")
                uses_perm.set(android_name_attr, perm)
                root.insert(0, uses_perm)

        xml_bytes = ET.tostring(root, encoding="utf-8")
        pretty = minidom.parseString(xml_bytes).toprettyxml(indent=" ")

        with open(manifest_path, "w", encoding="utf-8") as f:
            f.write(pretty)

        print("Permissions ajoutées (XML-safe) :", permissions)
        PYEOF

    - name: Setup keystore stable (KEYSTORE_BASE64 secret)
      run: |
        KEYSTORE_DIR="$HOME/.android"
        mkdir -p "$KEYSTORE_DIR"
        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_DIR/debug.keystore"
          echo "✓ Keystore restauré depuis KEYSTORE_BASE64"
        else
          echo "⚠️ KEYSTORE_BASE64 manquant — APK non updatable sans désinstall"
          keytool -genkeypair -v -keystore "$KEYSTORE_DIR/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=FamilyHub,O=Famille Dieul-Gandet,C=FR" 2>/dev/null || true
        fi

    - name: Debug keystore artifact (temp)
      if: always()
      run: |
        ls -R "$HOME/.android" || true
        if [ -f "$HOME/.android/debug.keystore" ]; then
          cp "$HOME/.android/debug.keystore" debug.keystore
        else
          echo "No debug.keystore found in $HOME/.android"
        fi

    - name: Upload debug.keystore (temp)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-keystore-temp
        path: debug.keystore
        retention-days: 1

    - name: Inject versionCode in build.gradle (scoped)
      run: |
        python3 - << 'PYEOF'
        import re, os

        path = "android/app/build.gradle"
        with open(path, encoding="utf-8") as f:
            content = f.read()

        vc = os.environ.get("VERSION_CODE", "10000")
        vn = os.environ.get("VERSION_NAME", "2.0")

        def replace_in_default_config(text, pattern, repl):
            def _repl(match):
                block = match.group(0)
                block = re.sub(pattern, repl, block)
                return block
            return re.sub(r"defaultConfigs*{[^}]*}", _repl, text, flags=re.DOTALL)

        content = replace_in_default_config(
            content,
            r"versionCodes+d+",
            f"versionCode {vc}",
        )

        content = replace_in_default_config(
            content,
            r'versionNames+"[^"]+"',
            f'versionName "{vn}"',
        )

        with open(path, "w", encoding="utf-8") as f:
            f.write(content)

        print(f"✓ versionCode={vc}, versionName={vn}")
        PYEOF

    - name: Fix gradlew permissions
      run: chmod +x android/gradlew

    - name: Clean & Build APK
      run: |
        cd android
        ./gradlew clean assembleDebug --no-daemon

    - name: Display APK info
      run: |
        APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
        if [ -f "$APK_PATH" ]; then
          SIZE=$(du -sh "$APK_PATH" | cut -f1)
          echo "✓ APK généré : $APK_PATH ($SIZE)"
        else
          echo "❌ APK non trouvé"
          exit 1
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FamilyHub-v${{ github.run_number }}-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
