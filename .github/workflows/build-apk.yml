name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '24'

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          node_modules
        key: ${{ runner.os }}-gradle-node-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-gradle-node-

    - name: Install Capacitor 8
      run: |
        npm install @capacitor/core@8.0.0 @capacitor/cli@8.0.0 @capacitor/android@8.0.0 --no-audit --no-fund --prefer-offline

    # Définir versionCode / versionName + infos de build
    - name: Set versionCode auto
      run: |
        VERSION_CODE=$(date +%Y%m%d)$(printf "%02d" $((GITHUB_RUN_NUMBER % 100)))
        VERSION_NAME="2.$(date +%Y%m%d)"
        echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

        BUILD_DATE=$(date '+%d/%m/%Y %H:%M')
        echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

        BUILD_ID=$(date +%Y%m%d-%H%M)-run${GITHUB_RUN_NUMBER}
        echo "BUILD_ID=$BUILD_ID" >> $GITHUB_ENV

