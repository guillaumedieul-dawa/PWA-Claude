name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'

      - uses: actions/setup-java@v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps + Capacitor
        run: |
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0
          npx cap init "FamilyHub" "com.famille.dieulgandet" --web-dir www

      - name: Copy web files
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true
          cp -r icons/ www/ 2>/dev/null || true
          cp -r locker-tracker/ www/ 2>/dev/null || true
          cp -r todo-partage/ www/ 2>/dev/null || true
          cp -r cave-spiritueux/ www/ 2>/dev/null || true
          cp -r menus-semaine/ www/ 2>/dev/null || true
          cp -r liste-courses/ www/ 2>/dev/null || true

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Inject SMS Java plugin
        run: |
          PLUGIN_DIR="android/app/src/main/java/com/famille/dieulgandet"
          mkdir -p $PLUGIN_DIR

          # Plugin Java natif qui lit les SMS sans dépendance externe
          cat > $PLUGIN_DIR/SmsPlugin.java << 'JAVA'
package com.famille.dieulgandet;

import android.Manifest;
import android.content.pm.PackageManager;
import android.database.Cursor;
import android.net.Uri;
import androidx.core.app.ActivityCompat;
import com.getcapacitor.JSArray;
import com.getcapacitor.JSObject;
import com.getcapacitor.Plugin;
import com.getcapacitor.PluginCall;
import com.getcapacitor.PluginMethod;
import com.getcapacitor.annotation.CapacitorPlugin;
import com.getcapacitor.annotation.Permission;
import com.getcapacitor.annotation.PermissionCallback;

@CapacitorPlugin(
    name = "SmsPlugin",
    permissions = {
        @Permission(strings = { Manifest.permission.READ_SMS }, alias = "readSms"),
        @Permission(strings = { Manifest.permission.RECEIVE_SMS }, alias = "receiveSms")
    }
)
public class SmsPlugin extends Plugin {

    @PluginMethod
    public void getSMSList(PluginCall call) {
        if (getPermissionState("readSms") != com.getcapacitor.PermissionState.GRANTED) {
            requestPermissionForAlias("readSms", call, "smsPermissionCallback");
            return;
        }
        readAndReturnSMS(call);
    }

    @PermissionCallback
    private void smsPermissionCallback(PluginCall call) {
        if (getPermissionState("readSms") == com.getcapacitor.PermissionState.GRANTED) {
            readAndReturnSMS(call);
        } else {
            call.reject("Permission SMS refusée");
        }
    }

    private void readAndReturnSMS(PluginCall call) {
        JSArray messages = new JSArray();
        try {
            int count = call.getInt("count", 300);
            Uri uri = Uri.parse("content://sms/inbox");
            String[] projection = {"_id", "address", "body", "date"};
            Cursor cursor = getContext().getContentResolver().query(
                uri, projection, null, null, "date DESC LIMIT " + count
            );
            if (cursor != null) {
                while (cursor.moveToNext()) {
                    JSObject msg = new JSObject();
                    msg.put("id",      cursor.getString(cursor.getColumnIndexOrThrow("_id")));
                    msg.put("address", cursor.getString(cursor.getColumnIndexOrThrow("address")));
                    msg.put("body",    cursor.getString(cursor.getColumnIndexOrThrow("body")));
                    msg.put("date",    cursor.getLong(cursor.getColumnIndexOrThrow("date")));
                    messages.put(msg);
                }
                cursor.close();
            }
        } catch (Exception e) {
            call.reject("Erreur lecture SMS : " + e.getMessage());
            return;
        }
        JSObject result = new JSObject();
        result.put("messages", messages);
        call.resolve(result);
    }
}
JAVA

          # MainActivity qui enregistre le plugin
          cat > $PLUGIN_DIR/MainActivity.java << 'JAVA'
package com.famille.dieulgandet;

import com.getcapacitor.BridgeActivity;
import android.os.Bundle;

public class MainActivity extends BridgeActivity {
    @Override
    public void onCreate(Bundle savedInstanceState) {
        registerPlugin(SmsPlugin.class);
        super.onCreate(savedInstanceState);
    }
}
JAVA

      - name: Set permissions in AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.READ_SMS"/>\n    <uses-permission android:name="android.permission.RECEIVE_SMS"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n</manifest>|' $MANIFEST

      - name: Fix gradlew permissions
        run: chmod +x android/gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: FamilyHub-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
