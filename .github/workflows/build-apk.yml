name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Cache Gradle + node_modules pour accélérer le build (5-7min → 1-2min)
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            node_modules
          key: ${{ runner.os }}-gradle-node-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-node-

      - name: Install Capacitor 8
        run: |
          npm install @capacitor/core@8.0.0 @capacitor/cli@8.0.0 @capacitor/android@8.0.0 \
            --no-audit --no-fund --prefer-offline
          # capacitor.config.json géré dans le repo — pas besoin de npx cap init

      - name: Copy web files to www/
        run: |
          mkdir -p www
          # capacitor.config.json doit rester à la racine (Capacitor le lit depuis là)
          if [ ! -f capacitor.config.json ]; then
            echo '{"appId":"com.famille.dieulgandet","appName":"FamilyHub","webDir":"www","android":{"allowMixedContent":true,"webContentsDebuggingEnabled":false},"plugins":{"SplashScreen":{"launchShowDuration":0}}}' > capacitor.config.json
          fi
          cp -f index.html www/ 2>/dev/null || true
          cp -f manifest.json www/ 2>/dev/null || true
          cp -f sw.js www/ 2>/dev/null || true
          cp -rf icons/ www/ 2>/dev/null || true
          cp -rf locker-tracker/ www/ 2>/dev/null || true
          cp -rf todo-partage/ www/ 2>/dev/null || true
          cp -rf cave-spiritueux/ www/ 2>/dev/null || true
          cp -rf menus-semaine/ www/ 2>/dev/null || true
          cp -rf liste-courses/ www/ 2>/dev/null || true

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Copy SmsPlugin Java files (depuis android-src/ dans le repo)
        run: |
          PLUGIN_DIR="android/app/src/main/java/com/famille/dieulgandet"
          mkdir -p $PLUGIN_DIR
          cp android-src/SmsPlugin.java $PLUGIN_DIR/SmsPlugin.java
          cp android-src/MainActivity.java $PLUGIN_DIR/MainActivity.java

      - name: Add SMS permissions in AndroidManifest
        run: |
          python3 - << 'PYEOF'
          import re

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              content = f.read()

          permissions = [
              'android.permission.READ_SMS',
              'android.permission.RECEIVE_SMS',
              'android.permission.INTERNET',
              'android.permission.ACCESS_NETWORK_STATE',
          ]

          for perm in permissions:
              tag = f'<uses-permission android:name="{perm}"/>'
              if perm not in content:
                  content = content.replace('</manifest>', f'    {tag}\n</manifest>')

          with open(manifest_path, "w") as f:
              f.write(content)

          print("Permissions ajoutees :", permissions)
          PYEOF

      - name: Setup keystore stable (KEYSTORE_BASE64 secret)
        run: |
          KEYSTORE_DIR="$HOME/.android"
          mkdir -p "$KEYSTORE_DIR"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_DIR/debug.keystore"
            echo "✓ Keystore restauré depuis KEYSTORE_BASE64"
          else
            echo "⚠️  KEYSTORE_BASE64 manquant — APK non updatable sans désinstall"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_DIR/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=FamilyHub,O=Famille Dieul-Gandet,C=FR" \
              2>/dev/null || true
          fi

      - name: Set versionCode auto (évite les conflits de version)
        run: |
          # versionCode = YYYYMMDDNN (date + numéro de run)
          VERSION_CODE=$(date +%Y%m%d)$(printf "%02d" $((GITHUB_RUN_NUMBER % 100)))
          VERSION_NAME="2.$(date +%Y%m%d)"
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "✓ versionCode: $VERSION_CODE, versionName: $VERSION_NAME"

      - name: Inject versionCode in build.gradle
        run: |
          python3 - << 'PYEOF'
          import re, os
          path = "android/app/build.gradle"
          with open(path) as f: content = f.read()
          vc = os.environ.get('VERSION_CODE','10000')
          vn = os.environ.get('VERSION_NAME','2.0')
          content = re.sub(r'versionCode\s+\d+', f'versionCode {vc}', content)
          content = re.sub(r'versionName\s+"[^"]+"', f'versionName "{vn}"', content)
          with open(path,'w') as f: f.write(content)
          print(f"✓ versionCode={vc}, versionName={vn}")
          PYEOF

      - name: Fix gradlew permissions
        run: chmod +x android/gradlew

      - name: Clean & Build APK
        run: |
          cd android
          ./gradlew clean assembleDebug --no-daemon

      - name: Display APK info
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            SIZE=$(du -sh "$APK_PATH" | cut -f1)
            echo "✓ APK généré : $APK_PATH ($SIZE)"
          else
            echo "❌ APK non trouvé — liste des fichiers générés :"
            find android/app/build/outputs -name "*.apk" 2>/dev/null || echo "Aucun APK"
            echo "--- Logs Gradle ---"
            find android -name "*.log" 2>/dev/null | head -3
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyHub-v${{ github.run_number }}-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
