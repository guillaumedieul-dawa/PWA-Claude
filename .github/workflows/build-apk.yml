name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'

      - uses: actions/setup-java@v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      # Cache Gradle + node_modules pour accélérer le build (5-7min → 1-2min)
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            node_modules
          key: ${{ runner.os }}-gradle-node-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-node-

      - name: Install Capacitor 5
        run: |
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0
          npx cap init "FamilyHub" "com.famille.dieulgandet" --web-dir www

      - name: Copy web files to www/
        run: |
          mkdir -p www
          cp -f index.html www/ 2>/dev/null || true
          cp -f manifest.json www/ 2>/dev/null || true
          cp -f sw.js www/ 2>/dev/null || true
          cp -rf icons/ www/ 2>/dev/null || true
          cp -rf locker-tracker/ www/ 2>/dev/null || true
          cp -rf todo-partage/ www/ 2>/dev/null || true
          cp -rf cave-spiritueux/ www/ 2>/dev/null || true
          cp -rf menus-semaine/ www/ 2>/dev/null || true
          cp -rf liste-courses/ www/ 2>/dev/null || true

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Copy SmsPlugin Java files (depuis android-src/ dans le repo)
        run: |
          PLUGIN_DIR="android/app/src/main/java/com/famille/dieulgandet"
          mkdir -p $PLUGIN_DIR
          cp android-src/SmsPlugin.java $PLUGIN_DIR/SmsPlugin.java
          cp android-src/MainActivity.java $PLUGIN_DIR/MainActivity.java

      - name: Add SMS permissions in AndroidManifest
        run: |
          python3 - << 'PYEOF'
          import re

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              content = f.read()

          permissions = [
              'android.permission.READ_SMS',
              'android.permission.RECEIVE_SMS',
              'android.permission.INTERNET',
              'android.permission.ACCESS_NETWORK_STATE',
          ]

          for perm in permissions:
              tag = f'<uses-permission android:name="{perm}"/>'
              if perm not in content:
                  content = content.replace('</manifest>', f'    {tag}\n</manifest>')

          with open(manifest_path, "w") as f:
              f.write(content)

          print("Permissions ajoutees :", permissions)
          PYEOF

      - name: Fix gradlew permissions
        run: chmod +x android/gradlew

      - name: Clean & Build APK
        run: |
          cd android
          ./gradlew clean assembleDebug --no-daemon

      - name: Display APK info
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            SIZE=$(du -sh "$APK_PATH" | cut -f1)
            echo "✓ APK généré : $APK_PATH ($SIZE)"
          else
            echo "❌ APK non trouvé"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: FamilyHub-v${{ github.run_number }}-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
