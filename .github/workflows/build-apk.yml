name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'

      - uses: actions/setup-java@v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install deps + Capacitor
        run: |
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0
          npx cap init "FamilyHub" "com.famille.dieulgandet" --web-dir www

      - name: Copy web files
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true
          cp -r icons/ www/ 2>/dev/null || true
          cp -r locker-tracker/ www/ 2>/dev/null || true
          cp -r todo-partage/ www/ 2>/dev/null || true
          cp -r cave-spiritueux/ www/ 2>/dev/null || true
          cp -r menus-semaine/ www/ 2>/dev/null || true
          cp -r liste-courses/ www/ 2>/dev/null || true

      - name: Add Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Inject SMS plugin (base64)
        run: |
          PLUGIN_DIR="android/app/src/main/java/com/famille/dieulgandet"
          mkdir -p $PLUGIN_DIR
          SMS_B64=""
          MAIN_B64=""
          echo "$SMS_B64"  | base64 -d > $PLUGIN_DIR/SmsPlugin.java
          echo "$MAIN_B64" | base64 -d > $PLUGIN_DIR/MainActivity.java

      - name: Set permissions in AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.READ_SMS"/>\n    <uses-permission android:name="android.permission.RECEIVE_SMS"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n</manifest>|' $MANIFEST

      - name: Increment versionCode for update-in-place
        run: |
          BUILD_NUM=${{ github.run_number }}
          sed -i "s/versionCode = 1/versionCode = ${BUILD_NUM}/" android/app/build.gradle
          sed -i "s/versionName = \"1.0\"/versionName = \"1.${BUILD_NUM}\"/" android/app/build.gradle

      - name: Fix gradlew permissions
        run: chmod +x android/gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: FamilyHub-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
