<!-- 
  EXEMPLE D'INTÉGRATION : todo-partage refactorisée
  
  Montre comment migrer todo-partage vers firebaseSync.js
  avec compatibilité totale du code métier existant.
  
  À adapter pour les autres sous-apps.
-->

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do Familial — Refactorisé</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  </style>
</head>
<body>
  <!-- ════════════════════════════════════════════════════════════════════════════
       1. CHARGER firebaseSync.js (CENTRALISÉ)
       ════════════════════════════════════════════════════════════════════════════ -->
  <script src="../firebaseSync.js"></script>

  <!-- ════════════════════════════════════════════════════════════════════════════
       2. CODE MÉTIER REFACTORISÉ
       ════════════════════════════════════════════════════════════════════════════ -->
  <script>
    // ────────────────────────────────────────────────────────────────────────────
    // Configuration du handler de synchronisation (NOUVEAU)
    // ────────────────────────────────────────────────────────────────────────────
    
    const TODO_COLLECTION = 'meta/todo/tasks';
    const todoSync = fbCreateSyncHandler(TODO_COLLECTION);
    
    // ────────────────────────────────────────────────────────────────────────────
    // WRAPPERS MÉTIER (compatibles avec l'ancien code)
    // ────────────────────────────────────────────────────────────────────────────
    
    /**
     * Charge toutes les tâches depuis Firebase
     * ANCIEN : fbLoadAll() [80 lignes de code dupliqué]
     * NOUVEAU : wrapper simple qui appelle todoSync
     */
    async function fbLoadAll() {
      return await todoSync.readAll();
    }
    
    /**
     * Écrit une tâche dans Firebase
     * ANCIEN : fbWriteTask(task) [20 lignes dupliquées]
     * NOUVEAU : wrapper simple
     */
    async function fbWriteTask(task) {
      return await todoSync.write(task.id, task);
    }
    
    /**
     * Supprime une tâche
     * ANCIEN : fbDeleteTask(id) [15 lignes dupliquées]
     * NOUVEAU : wrapper simple
     */
    async function fbDeleteTask(id) {
      return await todoSync.delete(id);
    }
    
    // ────────────────────────────────────────────────────────────────────────────
    // CODE MÉTIER INCHANGÉ (utilise les wrappers)
    // ────────────────────────────────────────────────────────────────────────────
    
    let tasks = [];
    
    async function init() {
      tasks = await fbLoadAll();
      if (!tasks) tasks = [];
      render();
    }
    
    async function addTask(title) {
      if (!title.trim()) return;
      
      const id = 'task-' + Date.now();
      const task = {
        id,
        title: title.trim(),
        done: false,
        createdAt: new Date().toISOString(),
        assignee: 'Guillaume'
      };
      
      const success = await fbWriteTask(task);
      if (success) {
        tasks.push(task);
        render();
      }
    }
    
    async function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.done = !task.done;
        await fbWriteTask(task);
        render();
      }
    }
    
    async function deleteTask(id) {
      const success = await fbDeleteTask(id);
      if (success) {
        tasks = tasks.filter(t => t.id !== id);
        render();
      }
    }
    
    function render() {
      // Afficher les tâches dans l'UI
      console.log('Tasks:', tasks);
    }
    
    // ────────────────────────────────────────────────────────────────────────────
    // OPTIONNEL : Utiliser directement firebaseSync (sans wrapper)
    // ────────────────────────────────────────────────────────────────────────────
    
    // Les anciennes lignes :
    //   const tasks = await fbLoadAll();
    //   
    // Peuvent maintenant aussi être :
    //   const tasks = await fbReadAll('meta/todo/tasks');
    //   await fbWrite('meta/todo/tasks', task.id, task);
    //   await fbDelete('meta/todo/tasks', id);
    
    // Au démarrage
    init();
  </script>
  
  <!-- Le reste du HTML/CSS/JS métier reste INCHANGÉ -->
  <div id="app">
    <h1>To-Do Familial</h1>
    <input type="text" id="input" placeholder="Ajouter une tâche...">
    <button onclick="addTask(document.getElementById('input').value)">➕</button>
    <ul id="list"></ul>
  </div>

</body>
</html>
