<!-- FIX #1: Dark Mode -->
<script>
document.getElementById('themeToggle')?.addEventListener('click', () => {
  const root = document.documentElement;
  root.classList.toggle('dark');
  root.offsetHeight; // CRITICAL
  localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light');
});
</script>

<!-- FIX #2 & #3: Filters + Sheets -->
<script>
function findAction(elem) {
  while (elem && elem !== document.body) {
    if (elem.dataset?.action) return elem;
    elem = elem.parentElement;
  }
  return null;
}

document.addEventListener('click', (e) => {
  const btn = findAction(e.target);
  if (!btn) return;
  const action = btn.dataset.action;
  
  // Filters
  if (action.startsWith('filter-')) {
    const type = action.replace('filter-', '');
    document.querySelectorAll('[data-action^="filter-"]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyBottlesFilter(type);
  }
  
  // Sheets
  if (action === 'add-bottle') openSheet('add-bottle-sheet');
  if (action === 'close-sheet') closeSheet(btn.closest('.sheet')?.id);
});

function openSheet(id) {
  const sheet = document.getElementById(id);
  if (sheet) sheet.style.cssText = 'display: flex; opacity: 1; animation: slideUp 0.3s;';
}

function closeSheet(id) {
  const sheet = document.getElementById(id);
  if (sheet) sheet.style.cssText = 'display: none; opacity: 0;';
}

window.openSheet = openSheet;
window.closeSheet = closeSheet;
</script>

<!-- CSS -->
<style>
@keyframes slideUp {
  from { transform: translateY(100%); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
button > span { pointer-events: none; }
[data-action^="filter-"].active { background-color: var(--primary-color, #007AFF); color: white; }
</style>
