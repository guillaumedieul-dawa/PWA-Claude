<head>
<meta charset="UTF-8">
<meta name="build-date" content="__BUILD_DATE__">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" id="meta-theme" content="#faf7f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FamilyHub">
<title>FamilyHub</title>
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">

<style>
/* ── VARIABLES THEMES INTEGREES (ANTI-CACHE) ── */
[data-theme="light"] {
  --p: #2563eb; --op: #fff;
  --pc: #dbeafe; --opc: #1e3a8a;
  --s: #059669; --sc: #d1fae5;
  --t: #7c3aed; --tc: #ede9fe;
  --bg: #faf7f2; --sf: #fff;
  --s1: #f0ebe2; --s2: #e8e2d8;
  --olv: #e0d9cf; --ob: #1c1410;
  --os: #1c1410; --osv: #7a6a5a;
  --sh: rgba(0,0,0,.05);
}
[data-theme="dark"] {
  --p: #60a5fa; --op: #1e3a8a;
  --pc: #1e3a8a; --opc: #dbeafe;
  --s: #34d399; --sc: #064e3b;
  --t: #a78bfa; --tc: #2e1065;
  --bg: #1a1714; --sf: #231e1a;
  --s1: #2c2620; --s2: #352e27;
  --olv: #3e352d; --ob: #f0ebe2;
  --os: #f0ebe2; --osv: #a09080;
  --sh: rgba(0,0,0,.3);
}
[data-theme="sepia"] {
  --p: #7c3d12; --op: #fffbf5;
  --pc: #fed7aa; --opc: #431407;
  --s: #3d6b12; --sc: #d9f99d;
  --t: #5b21b6; --tc: #ede9fe;
  --bg: #f5ead6; --sf: #fdf6e3;
  --s1: #f0e0c0; --s2: #e8d4a8;
  --olv: #d4b896; --ob: #2d1a0a;
  --os: #2d1a0a; --osv: #8b6950;
  --sh: rgba(80,40,0,.08);
}
[data-theme] {
  --top: env(safe-area-inset-top, 0px);
  --bot: env(safe-area-inset-bottom, 0px);
  --rl: 20px;
  color-scheme: normal;
}

/* ── BASE & RESET ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  min-height: 100dvh;
  background: var(--bg);
  color: var(--ob);
  font-family: 'Google Sans Text', sans-serif;
  overflow-x: hidden;
  transition: background .3s, color .3s;
}

/* ── LAYOUT DE LA PAGE ── */
#app{max-width:520px;margin:0 auto;padding:calc(var(--top)+10px) 16px calc(var(--bot)+10px)}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.hdr-eyebrow{font-size:11px;color:var(--osv);letter-spacing:.5px;font-family:'Google Sans',sans-serif}
.hdr-title{font-family:'Google Sans',sans-serif;font-size:28px;font-weight:700;color:var(--ob);letter-spacing:-.5px;line-height:1.1}
.ibtn{width:40px;height:40px;border-radius:50%;border:none;background:var(--s1);color:var(--os);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.ibtn:active{background:var(--s2)}
.greeting{background:var(--p);border-radius:var(--rl);padding:12px 20px;margin-bottom:12px;color:var(--op)}
.greet-lbl{font-size:12px;opacity:.8;font-family:'Google Sans',sans-serif;letter-spacing:.3px}
.greet-name{font-family:'Google Sans',sans-serif;font-size:20px;font-weight:700;margin-top:2px}
.greet-sub{font-size:12px;opacity:.8;margin-top:3px;line-height:1.4}
.sec-lbl{font-family:'Google Sans',sans-serif;font-size:13px;font-weight:500;color:var(--osv);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}
.app-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:0}
.app-card{background:var(--sf);border-radius:var(--rl);padding:12px 14px;cursor:pointer;box-shadow:0 1px 3px var(--sh);transition:all .2s;text-decoration:none;display:flex;flex-direction:column;gap:8px;border:1px solid transparent}
.app-card:active{transform:scale(.97);border-color:var(--olv)}
.app-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:2px}
.app-name{font-family:'Google Sans',sans-serif;font-size:13px;font-weight:700;color:var(--os)}
.app-desc{font-size:11px;color:var(--osv);line-height:1.3}
.app-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;font-family:'Google Sans',sans-serif;margin-top:2px}
.footer{text-align:center;font-size:11px;color:var(--osv);margin-top:8px;font-family:'Roboto Mono',monospace}
</style>

<script>
(function() {
  var THEMES = ['light', 'dark', 'sepia'];
  var THEME_COLORS = { 'light': '#faf7f2', 'dark': '#1a1714', 'sepia': '#f5ead6' };
  
  window.applyTheme = function(t) {
    if (THEMES.indexOf(t) === -1) t = 'light';
    
    document.documentElement.setAttribute('data-theme', t);
    if (document.body) document.body.setAttribute('data-theme', t);
    
    try { localStorage.setItem('fh_theme', t); } catch(e) {}
    
    var btn = document.getElementById('thbtn');
    if (btn) btn.textContent = (t === 'dark' ? '🌙' : (t === 'sepia' ? '📜' : '☀️'));
    
    var meta = document.getElementById('meta-theme');
    if (meta) meta.setAttribute('content', THEME_COLORS[t]);
  };

  window.toggleTheme = function() {
    var cur = document.documentElement.getAttribute('data-theme') || 'light';
    var next = THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length];
    window.applyTheme(next);
  };

  var saved = 'light';
  try { saved = localStorage.getItem('fh_theme'); } catch(e) {}
  if (!saved) {
    try { saved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch(e) {}
  }
  window.applyTheme(saved || 'light');
})();
</script>
</head>
