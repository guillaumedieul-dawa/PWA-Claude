
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf7f2">
    <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#1a1714">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <meta name="build-date" content="2026-06-09">

    <title>FamilyHub Hub</title>

    <link rel="manifest" href="./manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./themes.css?v=2">
    <script src="./theme.js?v=2"></script>

    <style>
        :root { --w: #fff; --b: #000; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; padding: 20px; background: var(--bg-color); color: var(--text-color); transition: background 0.3s; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        
        h1 { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; margin-bottom: 20px; }
        h2 { font-size: 1.1rem; margin-bottom: 15px; text-transform: uppercase; color: var(--accent); }
        
        /* Styles Firebase & Maintenance */
        label { display: block; margin-top: 10px; font-weight: 600; font-size: 0.85rem; }
        input { width: 100%; padding: 12px; margin: 5px 0 15px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; background: var(--w); color: var(--b); }
        button { width: 100%; padding: 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; }
        .btn-save { background: var(--b); color: var(--w); }
        .btn-danger { background: #ef4444; color: white; margin-top: 10px; }
        
        /* Navigation & Pictos */
        nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 30px; }
        .nav-btn { background: var(--card-bg); padding: 20px; text-align: center; text-decoration: none; color: var(--text-color); border: 1px solid var(--border-color); border-radius: 8px; font-weight: bold; position: relative; display: flex; flex-direction: column; align-items: center; }
        .nav-icon { font-size: 1.5rem; margin-bottom: 5px; }
        
        /* Badge Compteur */
        .badge { position: absolute; top: 10px; right: 10px; background: #ef4444; color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; font-weight: bold; }
        
        footer { text-align: center; font-size: 0.8rem; color: #666; margin-top: 40px; }
    </style>
</head>
<body>

    <h1>FamilyHub Hub</h1>

    <div class="card">
        <h2>Configuration Firebase</h2>
        <label>API Key</label>
        <input type="text" id="fbKey" placeholder="AIza...">
        <label>Project ID</label>
        <input type="text" id="fbProj" placeholder="familyhub-colis-8abbd">
        <button class="btn-save" onclick="saveConfig()">Sauvegarder</button>
    </div>

    <div class="card">
        <h2>Maintenance</h2>
        <button class="btn-danger" onclick="clearQueue()">Vider file d'attente (Debug)</button>
    </div>

    <nav>
        <a href="./locker-tracker/index.html" class="nav-btn">
            <span class="nav-icon">📦</span>
            <span>LockerTracker</span>
            <span id="tracker-badge" class="badge">0</span>
        </a>
        <a href="./liste-courses/index.html" class="nav-btn">
            <span class="nav-icon">🛒</span>
            <span>Courses</span>
        </a>
        <a href="./todo-partage/index.html" class="nav-btn">
            <span class="nav-icon">✅</span>
            <span>Todo</span>
        </a>
        <a href="./cave-spiritueux/index.html" class="nav-btn">
            <span class="nav-icon">🍷</span>
            <span>Cave</span>
        </a>
    </nav>

    <div id="theme-selector"></div>
    <footer>
        <div id="footerBuild"></div>
    </footer>

    <script>
        // --- LOGIQUE FIREBASE ---
        function loadConfig() {
            const config = JSON.parse(localStorage.getItem('lt_fb') || '{}');
            if(config.apiKey) document.getElementById('fbKey').value = config.apiKey;
            if(config.projectId) document.getElementById('fbProj').value = config.projectId;
        }

        function saveConfig() {
            const data = {
                apiKey: document.getElementById('fbKey').value,
                projectId: document.getElementById('fbProj').value
            };
            localStorage.setItem('lt_fb', JSON.stringify(data));
            alert('Configuration enregistrée.');
        }

        function clearQueue() {
            if(confirm('Vider la file d\'attente ?')) {
                localStorage.removeItem('fb_wq');
                localStorage.removeItem('fb_offline_queue');
                alert('File d\'attente vidée.');
            }
        }

        // --- MISE À JOUR FOOTER ---
        var bel = document.getElementById('footerBuild');
        if (bel) {
            var meta = document.querySelector('meta[name="build-date"]');
            var bd = meta ? meta.getAttribute('content') : '';
            bel.innerHTML = 'Version applicative : __VERSION_NAME__<br />Build : __BUILD_ID__ ' + (bd ? '— généré le ' + bd : '');
        }

        // --- MÀJ COMPTEUR TRACKER ---
        // Appelée pour mettre à jour le badge visuel
        function updateTrackerBadge(count) {
            const badge = document.getElementById('tracker-badge');
            if (badge) {
                badge.textContent = count;
                badge.style.display = count > 0 ? 'block' : 'none';
            }
        }

        loadConfig();
    </script>
</body>
</html>
