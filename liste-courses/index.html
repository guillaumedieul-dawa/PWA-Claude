<header style="display: flex; justify-content: space-between; align-items: center; padding: var(--rm);">
  <h1 style="font-family: 'Bebas Neue', sans-serif; font-size: 2rem;">Liste de courses</h1>
  <button id="thbtn" onclick="window.toggleTheme()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;"></button>
</header>

<script src="/firebaseSync.js"></script>
<script>
// Votre logique applicative existante
let D = { items: [] };
let shops = ['Supermarché', 'Marché', 'Boulangerie'];

// Les écouteurs d'événements spécifiques au changement de thème si vous avez besoin de rafraîchir des composants graphiques (ex: graphiques, canvas)
window.addEventListener('fhThemeChanged', (e) => {
  console.log("Le thème a changé dans le module Liste de courses :", e.detail.theme);
  // Ajoutez ici du code si un composant spécifique a besoin d'être redessiné à la volée
});

function renderShopChips() {
  // Votre logique d'affichage des magasins d'origine...
}

function render() {
  // Votre logique d'affichage des articles d'origine...
}

function saveShops(arr) { localStorage.setItem('fh_courses_shops', JSON.stringify(arr)); }
function saveLocal() { localStorage.setItem('fh_courses_data', JSON.stringify(D)); }

// Remplacement de votre ancienne fonction initTheme locale
async function init() {
  document.querySelectorAll('.sov').forEach(el => { el.style.display = 'none'; });
  
  // Lecture des magasins et données locales
  const lsShops = localStorage.getItem('fh_courses_shops');
  if (lsShops) shops = JSON.parse(lsShops);
  const lsData = localStorage.getItem('fh_courses_data');
  if (lsData) D = JSON.parse(lsData);

  renderShopChips();
  render();

  // Synchronisation distante
  const remote = await fbLoadAll();
  if (remote && remote.length > 0) {
    const localMap = {};
    D.items.forEach(t => { localMap[t.id] = t; });
    remote.forEach(t => { localMap[t.id] = t; });
    D.items = Object.values(localMap).sort((a,b) => new Date(b.date||0) - new Date(a.date||0));
    saveLocal();
    render();
  }
}

// Lancement de l'initialisation de l'application
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
