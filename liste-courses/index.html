<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf7f2">
<meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#1a1714">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Liste de courses">
<title>Liste de courses</title>
<link rel="manifest" href="./manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fragment+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../themes.css?v=2">
<script src="../theme.js?v=2"></script>

<style>
:root {
  --w: #fff;
  --b: #000;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body {
  padding: calc(var(--top) + 16px) var(--rm) calc(var(--bot) + 90px) var(--rm);
  font-family: 'Plus Jakarta Sans', sans-serif;
  user-select: none; -webkit-user-select: none;
  background: var(--bg);
}
header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.hdr-title-block { display:flex; align-items:center; gap:12px; }
h1 { font-family:'Bebas Neue',sans-serif; font-size:42px; letter-spacing:1px; color:var(--ob); line-height:1; }
.hdr-btns { display:flex; gap:10px; align-items:center; }
.circle-btn {
  width:42px; height:42px; border-radius:50%; background:var(--sf);
  box-shadow:0 2px 8px var(--sh); display:flex; align-items:center; justify-content:center;
  font-size:18px; border:none; cursor:pointer; transition:transform 0.1s; text-decoration:none;
}
.circle-btn:active { transform:scale(0.92); }

#syncDot { width: 12px; height: 12px; border-radius: 50%; background: #22c55e; transition: background 0.3s; }
@keyframes fbPulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

/* Chips Magasins */
.chips-scroll { display:flex; gap:8px; overflow-x:auto; padding:4px 4px 12px 4px; margin:0 -4px; scrollbar-width:none; }
.chips-scroll::-webkit-scrollbar { display:none; }
.chip {
  padding:8px 16px; border-radius:20px; background:var(--sf); color:var(--osv);
  font-size:13px; font-weight:600; white-space:nowrap; box-shadow:0 2px 6px var(--sh);
  border:1px solid transparent; cursor:pointer;
}
.chip.active { background:var(--pc); color:var(--opc); border-color:var(--p); }

/* Formulaire d'ajout sécurisé (Hauteur maitrisée pour éviter le hors-écran) */
.add-box {
  background:var(--sf); padding:12px; border-radius:16px; box-shadow:0 4px 14px var(--sh);
  margin-bottom:16px; display:flex; flex-direction:column; gap:8px;
}
.add-row1 { display:flex; gap:8px; align-items:center; }
.add-box input, .add-box select {
  border:none; background:var(--s1); padding:10px 12px; border-radius:10px;
  font-family:inherit; font-size:14px; font-weight:500; color:var(--ob); outline:none; height:42px;
}
.add-box input { flex:1; min-width:0; }
.add-box select { width: 105px; font-size: 12px; color: var(--osv); }
.add-box button {
  height:42px; padding:0 16px; border-radius:10px; background:var(--p); color:var(--op);
  font-weight:700; border:none; cursor:pointer; font-size:14px; flex-shrink:0;
}
.rayons-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.rayon-opt {
  padding:6px 2px; border-radius:8px; background:var(--s1); text-align:center;
  font-size:10px; font-weight:600; color:var(--osv); cursor:pointer; border:1px solid transparent;
}
.rayon-opt.active { background:var(--sc); color:var(--s); border-color:var(--s); }

/* Groupes de Rayons */
.rayon-group { margin-bottom:14px; background:var(--sf); border-radius:14px; box-shadow:0 2px 8px var(--sh); overflow:hidden; }
.rayon-header {
  padding:10px 14px; background:var(--s1); color:var(--os); font-weight:700;
  font-size:12px; text-transform:uppercase; letter-spacing:0.5px; display:flex; justify-content:space-between;
}
.rayon-header span.count { color:var(--osv); font-weight:500; }

/* Items */
.item-row-container { position:relative; overflow:hidden; background:var(--sf); }
.item-row-container:not(:last-child)::after {
  content:''; position:absolute; bottom:0; left:48px; right:14px; height:1px; background:var(--olv); z-index:1;
}
.swipe-bg {
  position:absolute; top:0; left:0; width:100%; height:100%; display:flex;
  align-items:center; justify-content:flex-end; padding-right:20px;
  background:var(--cfb); color:var(--cf); font-size:16px; font-weight:700; z-index:0;
}
.item-row {
  position:relative; z-index:2; background:var(--sf); padding:12px 14px;
  display:flex; align-items:center; justify-content:space-between;
  transform:translateX(0); transition:transform 0.15s ease-out; touch-action:pan-y;
}
.item-left { display:flex; align-items:center; gap:10px; flex:1; min-width: 0; }
.chk {
  width:22px; height:22px; border-radius:6px; border:2px solid var(--olv);
  display:flex; align-items:center; justify-content:center; color:var(--op); font-size:12px; transition:all 0.1s; flex-shrink: 0;
}
.item-row.checked .chk { background:var(--s); border-color:var(--s); }
.item-text { font-size:14px; font-weight:500; color:var(--ob); transition:all 0.1s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-row.checked .item-text { color:var(--osv); text-decoration:line-through; }
.item-meta { display:flex; align-items:center; gap:6px; flex-shrink: 0; }
.qte-badge { padding:2px 6px; background:var(--s1); color:var(--osv); font-size:11px; font-weight:700; border-radius:6px; }
.shop-mini { font-size:11px; font-weight:600; color:var(--p); background:var(--pc); padding:2px 6px; border-radius:6px; }
.user-badge { font-size:10px; font-weight:500; color:var(--osv); opacity:0.8; background:var(--s2); padding:2px 6px; border-radius:6px; }

/* Fenêtres Modales Sur-Mesure (Style Premium Site) */
.modal-backdrop {
  position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.5);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  z-index:200; display:none; opacity:0; transition:opacity 0.2s;
}
.modal-backdrop.show { display:block; opacity:1; }
.modal-box {
  position:fixed; top:50%; left:50%; transform: translate(-50%, -40%) scale(0.95);
  width:calc(100% - 32px); max-width:360px; background:var(--sf); border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2); z-index:201; display:none;
  padding:20px; transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.modal-box.show { display:block; transform: translate(-50%, -50%) scale(1); }
.modal-box h3 { font-size:18px; font-weight:700; color:var(--ob); margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.modal-form-group { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
.modal-form-group label { font-size:11px; font-weight:700; text-transform:uppercase; color:var(--osv); letter-spacing:0.5px; }
.modal-box input, .modal-box select {
  width:100%; border:none; background:var(--s1); padding:12px; border-radius:10px;
  font-family:inherit; font-size:14px; color:var(--ob); outline:none;
}
/* Compteur Quantité Expert */
.qte-picker { display:flex; gap:10px; align-items:center; }
.qte-btn {
  width:40px; height:40px; border-radius:10px; background:var(--s1); color:var(--ob);
  border:none; font-size:18px; font-weight:700; display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.qte-btn:active { background:var(--s2); }
.qte-value { font-size:16px; font-weight:700; color:var(--ob); width:30px; text-align:center; }

.modal-actions { display:flex; gap:10px; margin-top:20px; justify-content:flex-end; }
.btn-secondary { padding:10px 16px; background:var(--s1); color:var(--osv); font-weight:600; border-radius:10px; border:none; font-size:14px; }
.btn-primary { padding:10px 20px; background:var(--p); color:var(--op); font-weight:700; border-radius:10px; border:none; font-size:14px; }

/* Bottom Sheet Magasins */
.sheet-backdrop {
  position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.4); z-index:100; display:none; opacity:0; transition:opacity 0.25s;
}
.sheet {
  position:fixed; bottom:0; left:0; width:100vw; background:var(--sf);
  border-radius:24px 24px 0 0; box-shadow:0 -4px 20px rgba(0,0,0,0.15); z-index:101;
  transform:translateY(100%); transition:transform 0.25s cubic-bezier(0.1, 0.7, 0.1, 1);
  padding:20px 20px calc(var(--bot) + 20px) 20px;
}
.sheet-backdrop.show { display:block; opacity:1; }
.sheet.show { transform:translateY(0); }
.sheet-handle { width:40px; height:4px; background:var(--olv); border-radius:2px; margin:0 auto 16px auto; }
.sheet h3 { font-size:17px; font-weight:700; color:var(--ob); margin-bottom:14px; }
.sheet-list { display:flex; flex-direction:column; gap:8px; margin-bottom:14px; max-height:180px; overflow-y:auto; }
.sheet-item {
  display:flex; justify-content:space-between; align-items:center; padding:10px 14px;
  background:var(--s1); border-radius:10px; font-weight:600; font-size:13px; color:var(--ob);
}
.sheet-item .del { color:var(--cf); font-size:14px; padding:4px; cursor:pointer; }
.sheet-add { display:flex; gap:8px; }
.sheet-add input { flex:1; border:none; background:var(--s1); padding:10px 14px; border-radius:10px; font-family:inherit; font-size:13px; color:var(--ob); outline:none; }
.sheet-add button { padding:0 14px; background:var(--p); color:var(--op); border-radius:10px; border:none; font-weight:700; font-size:13px; }
</style>
</head>
<body>

<header>
  <div class="hdr-title-block">
    <a href="../index.html" class="circle-btn">🔙</a>
    <h1>Liste de courses</h1>
  </div>
  <div class="hdr-btns">
    <div id="syncDot"></div>
    <button id="thbtn" class="circle-btn" onclick="window.toggleTheme()"></button>
    <button class="circle-btn" onclick="openSheet()">🏪</button>
  </div>
</header>

<div class="chips-scroll" id="chipsScroll"></div>

<div class="add-box">
  <div class="add-row1">
    <input type="text" id="addInput" placeholder="Ex: 3 Pommes ou Lait..." autocomplete="off">
    <select id="addShopSelect"></select>
    <button onclick="addItem()">OK</button>
  </div>
  <div class="rayons-grid" id="rayonsGrid"></div>
</div>

<div id="listContainer"></div>

<div class="sheet-backdrop" id="backdrop" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <h3>Gérer les magasins de la famille</h3>
  <div class="sheet-list" id="sheetList"></div>
  <div class="sheet-add">
    <input type="text" id="newShopInput" placeholder="Nouveau magasin..." autocomplete="off">
    <button onclick="addShop()">Ajouter</button>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop" onclick="closeEditModal()"></div>
<div class="modal-box" id="editModal">
  <h3>📝 Modifier l'article</h3>
  <input type="hidden" id="editId">
  
  <div class="modal-form-group">
    <label>Nom du produit</label>
    <input type="text" id="editName" autocomplete="off">
  </div>
  
  <div class="modal-form-group">
    <label>Quantité</label>
    <div class="qte-picker">
      <button class="qte-btn" onclick="changeEditQte(-1)">-</button>
      <div class="qte-value" id="editQteValue">1</div>
      <button class="qte-btn" onclick="changeEditQte(1)">+</button>
    </div>
  </div>
  
  <div class="modal-form-group">
    <label>Magasin assigné</label>
    <select id="editShopSelect"></select>
  </div>
  
  <div class="modal-actions">
    <button class="btn-secondary" onclick="closeEditModal()">Annuler</button>
    <button class="btn-primary" onclick="saveEditModal()">Enregistrer</button>
  </div>
</div>

<script src="./fbSync.js"></script>
<script>
let D = { items: [] };
let shops = ['Supermarché', 'Marché', 'Boulangerie'];
let activeShopFilter = 'Tous';
let selectedRayonIdx = 0;

const COLLECTION_ITEMS = 'courses';
const COLLECTION_CONFIG = 'courses_config';
const DOC_SHOPS_ID = 'magasins_shared';

const RAYONS = [
  { n: 'Frais / Légumes', e: '🥦' },
  { n: 'Épicerie', e: '🍝' },
  { n: 'Boucherie / Poisson', e: '🥩' },
  { n: 'Produits Laitiers', e: '🧀' },
  { n: 'Surgelés', e: '❄️' },
  { n: 'Boissons', e: '💧' },
  { n: 'Hygiène / Entretien', e: '🧼' },
  { n: 'Autre', e: '📦' }
];

// Identification automatique du membre connecté
function getFamilyUser() {
  try {
    const mainConfig = JSON.parse(localStorage.getItem('lt_fb'));
    if (mainConfig && mainConfig.userUser) return mainConfig.userUser;
    const user = localStorage.getItem('fh_user');
    return user ? user : 'Famille';
  } catch(e) {
    return 'Famille';
  }
}

function renderShopChips() {
  const container = document.getElementById('chipsScroll');
  let html = `<div class="chip ${activeShopFilter==='Tous'?'active':''}" onclick="setShopFilter('Tous')">🛒 Tous</div>`;
  shops.forEach(s => {
    html += `<div class="chip ${activeShopFilter===s?'active':''}" onclick="setShopFilter('${s.replace(/'/g, "\\'")}')">🏪 ${s}</div>`;
  });
  container.innerHTML = html;
  renderFormShopSelects();
}

function renderFormShopSelects() {
  const addSelect = document.getElementById('addShopSelect');
  const editSelect = document.getElementById('editShopSelect');
  
  let optionsHtml = '';
  shops.forEach(s => {
    optionsHtml += `<option value="${s}">${s}</option>`;
  });
  
  if(addSelect) {
    addSelect.innerHTML = optionsHtml;
    if(activeShopFilter !== 'Tous' && shops.includes(activeShopFilter)) {
      addSelect.value = activeShopFilter;
    }
  }
  if(editSelect) editSelect.innerHTML = optionsHtml;
}

function setShopFilter(s) {
  activeShopFilter = s;
  renderShopChips();
  render();
}

function renderRayonsGrid() {
  const container = document.getElementById('rayonsGrid');
  let html = '';
  RAYONS.forEach((r, idx) => {
    html += `<div class="rayon-opt ${selectedRayonIdx===idx?'active':''}" onclick="selectRayon(${idx})">${r.e}<br>${r.n.split(' ')[0]}</div>`;
  });
  container.innerHTML = html;
}

function selectRayon(idx) {
  selectedRayonIdx = idx;
  renderRayonsGrid();
}

function parseInput(str) {
  str = str.trim();
  let m = str.match(/^([0-9]+)\s*(x|X)?\s+(.+)$/);
  if (m) return { qte: parseInt(m[1]), name: m[3].trim() };
  return { qte: 1, name: str };
}

function addItem() {
  const inp = document.getElementById('addInput');
  const shopSelect = document.getElementById('addShopSelect');
  if (!inp.value.trim()) return;
  
  let p = parseInput(inp.value);
  let rName = RAYONS[selectedRayonIdx].n;
  let id = 'item_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
  
  let item = {
    id: id,
    name: p.name,
    qte: p.qte,
    rayon: rName,
    shop: shopSelect ? shopSelect.value : shops[0],
    checked: false,
    user: getFamilyUser(), // Tag du compte créateur
    date: new Date().toISOString()
  };
  
  D.items.unshift(item);
  inp.value = '';
  saveLocal();
  render();
  
  if (typeof fbQueue === 'function') {
    fbQueue(COLLECTION_ITEMS, id, item);
  }
}

function toggleItem(id) {
  let item = D.items.find(i => i.id === id);
  if (item) {
    item.checked = !item.checked;
    item.user = getFamilyUser(); // Met à jour qui a coché l'élément
    saveLocal();
    render();
    if (typeof fbQueue === 'function') {
      fbQueue(COLLECTION_ITEMS, id, item);
    }
  }
}

/* ═══════════════════════════════════════════
   INTERFACE DE MODIFICATION PREMIUM SUR-MESURE
   ═══════════════════════════════════════════ */
function openEditModal(id) {
  let item = D.items.find(i => i.id === id);
  if (!item) return;
  
  document.getElementById('editId').value = id;
  document.getElementById('editName').value = item.name;
  document.getElementById('editQteValue').textContent = item.qte;
  document.getElementById('editShopSelect').value = item.shop;
  
  document.getElementById('modalBackdrop').classList.add('show');
  document.getElementById('editModal').classList.add('show');
}

function closeEditModal() {
  document.getElementById('modalBackdrop').classList.remove('show');
  document.getElementById('editModal').classList.remove('show');
}

function changeEditQte(amount) {
  const qteEl = document.getElementById('editQteValue');
  let current = parseInt(qteEl.textContent) || 1;
  current += amount;
  if (current < 1) current = 1;
  qteEl.textContent = current;
}

function saveEditModal() {
  const id = document.getElementById('editId').value;
  let item = D.items.find(i => i.id === id);
  
  if (item) {
    item.name = document.getElementById('editName').value.trim() || item.name;
    item.qte = parseInt(document.getElementById('editQteValue').textContent) || 1;
    item.shop = document.getElementById('editShopSelect').value;
    item.user = getFamilyUser(); // Trace le dernier modificateur
    item.date = new Date().toISOString();
    
    saveLocal();
    render();
    if (typeof fbQueue === 'function') {
      fbQueue(COLLECTION_ITEMS, id, item);
    }
  }
  closeEditModal();
}

function deleteItem(id) {
  D.items = D.items.filter(i => i.id !== id);
  saveLocal();
  render();
  if (typeof fbDeleteQueue === 'function') {
    fbDeleteQueue(COLLECTION_ITEMS, id);
  }
}

function render() {
  const container = document.getElementById('listContainer');
  container.innerHTML = '';
  
  let filtered = D.items;
  if (activeShopFilter !== 'Tous') {
    filtered = filtered.filter(i => i.shop === activeShopFilter);
  }
  
  let groups = {};
  RAYONS.forEach(r => { groups[r.n] = []; });
  
  filtered.forEach(item => {
    if (!groups[item.rayon]) groups[item.rayon] = [];
    groups[item.rayon].push(item);
  });
  
  RAYONS.forEach(r => {
    let itemsInRayon = groups[r.n];
    if (!itemsInRayon || itemsInRayon.length === 0) return;
    
    itemsInRayon.sort((a,b) => a.checked - b.checked);
    
    let gBox = document.createElement('div');
    gBox.className = 'rayon-group';
    
    let unch = itemsInRayon.filter(i => !i.checked).length;
    gBox.innerHTML = `<div class="rayon-header"><span>${r.e} &nbsp;${r.n}</span><span class="count">${unch} / ${itemsInRayon.length}</span></div>`;
    
    itemsInRayon.forEach(item => {
      let rCont = document.createElement('div');
      rCont.className = 'item-row-container';
      
      // Affichage propre du nom du créateur (ex: "Par Papa")
      let userDisplay = item.user ? `<div class="user-badge">${item.user}</div>` : '';
      
      rCont.innerHTML = `
        <div class="swipe-bg">🗑️ Supprimer</div>
        <div class="item-row ${item.checked?'checked':''}" id="row_${item.id}">
          <div class="item-left">
            <div class="chk" onclick="toggleItem('${item.id}')">${item.checked?'✓':''}</div>
            <div class="item-text" onclick="openEditModal('${item.id}')">${item.name}</div>
          </div>
          <div class="item-meta">
            ${userDisplay}
            ${item.qte > 1 ? `<div class="qte-badge" onclick="openEditModal('${item.id}')">x${item.qte}</div>` : ''}
            ${activeShopFilter === 'Tous' ? `<div class="shop-mini">${item.shop}</div>` : ''}
          </div>
        </div>
      `;
      
      setupSwipe(rCont, item.id);
      gBox.appendChild(rCont);
    });
    
    container.appendChild(gBox);
  });
}

function setupSwipe(container, id) {
  let row = container.querySelector('.item-row');
  let startX = 0, currentX = 0, isSwiping = false;
  
  row.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
    isSwiping = true;
    row.style.transition = 'none';
  }, {passive:true});
  
  row.addEventListener('touchmove', e => {
    if (!isSwiping) return;
    currentX = e.touches[0].clientX - startX;
    if (currentX > 0) currentX = 0;
    if (currentX < -120) currentX = -120;
    row.style.transform = `translateX(${currentX}px)`;
  }, {passive:true});
  
  row.addEventListener('touchend', () => {
    isSwiping = false;
    row.style.transition = 'transform 0.15s ease-out';
    if (currentX < -70) {
      row.style.transform = 'translateX(-100%)';
      setTimeout(() => deleteItem(id), 140);
