<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf7f2">
<meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#1a1714">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Liste de courses">
<title>Liste de courses</title>
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="../themes.css">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fragment+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="../theme.js"></script>
<style>
#app{max-width:520px;margin:0 auto;min-height:100dvh;padding-bottom:calc(var(--bot)+96px)}
.tbar{position:sticky;top:0;z-index:100;background:var(--bg);padding:calc(var(--top)+16px) 20px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--olv)}
.ihome{width:36px;height:36px;border-radius:10px;border:none;background:var(--s1);color:var(--os);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;flex-shrink:0}
.ihome:active{background:var(--s2)}
.ttl{flex:1;min-width:0}
.tlbl{font-size:10px;color:var(--osv);letter-spacing:.3px;font-weight:500}
.th{font-family:'Bebas Neue',sans-serif!important;font-size:26px!important;letter-spacing:2px!important;color:var(--ob);line-height:1}
.ibtn{width:36px;height:36px;border-radius:10px;border:none;background:var(--s1);color:var(--os);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0}
.ibtn:active{background:var(--s2)}
.qadd{padding:12px 20px 4px;display:flex}
.qadd-in{flex:1;padding:11px 16px;border-radius:28px;border:1px solid var(--olv);background:var(--sf);color:var(--ob);font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;outline:none;transition:border-color .2s}
.qadd-in:focus{border-color:var(--p)}
.qadd-in::placeholder{color:var(--osv)}
.prog-wrap{padding:8px 16px 4px}
.prog-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--osv);margin-bottom:5px}
.prog-bar{height:5px;border-radius:3px;background:var(--s2);overflow:hidden}
.prog-fill{height:100%;border-radius:3px;background:var(--p);transition:width .4s}
.chips{display:flex;gap:8px;padding:10px 20px 12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:6px 16px;border-radius:20px;border:1px solid var(--olv);background:transparent;color:var(--osv);font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .15s}
.chip.sel{background:var(--pc,rgba(0,0,0,.08));border-color:var(--p);color:var(--p);font-weight:600}
.shop-chips{display:flex;gap:8px;padding:0 16px 8px;overflow-x:auto;scrollbar-width:none}
.shop-chips::-webkit-scrollbar{display:none}
.shop-chip{flex-shrink:0;padding:6px 12px;border-radius:8px;border:1px solid var(--olv);background:transparent;color:var(--osv);font-size:12px;cursor:pointer;white-space:nowrap}
.shop-chip.sel{background:var(--pc);border-color:var(--p);color:var(--opc)}
.ilist{padding:0 14px;display:flex;flex-direction:column;gap:6px}
.icard{background:var(--sf);border-radius:var(--rm);padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 2px var(--sh);border:1px solid var(--olv);cursor:pointer;transition:all .15s;animation:fu .25s ease both}
.icard.done{opacity:.45}
.icard.done .iname{text-decoration:line-through;color:var(--osv)}
.icard:active{transform:scale(.99)}
.chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--olv);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.chk.done{background:var(--p);border-color:var(--p)}
.ibody{flex:1;min-width:0}
.iname{font-size:14px;color:var(--os);font-weight:600}
.iqty{font-family:'Fragment Mono',monospace;font-size:11px;color:var(--osv);margin-top:2px}
.iwho{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;flex-shrink:0}
.icard-actions{display:flex;gap:2px;flex-shrink:0}
.icard-btn{padding:5px 6px;border-radius:8px;border:none;background:transparent;color:var(--osv);font-size:13px;cursor:pointer;opacity:.5}
.icard-btn:active{opacity:1}
.fab{position:fixed;bottom:calc(var(--bot)+80px);right:20px;width:56px;height:56px;border-radius:18px;background:var(--p);color:#fff;border:none;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.2);transition:transform .15s;z-index:99;will-change:transform}
.fab:active{transform:scale(.92)}
.toast{position:fixed;bottom:calc(var(--bot)+160px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--ob);color:var(--bg);padding:12px 20px;border-radius:28px;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:all .3s;white-space:nowrap;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
.shtit{font-family:'Bebas Neue',sans-serif!important;font-size:22px!important;letter-spacing:2px!important;color:var(--ob);margin-bottom:20px}
.slbl{font-size:11px;color:var(--osv);text-transform:uppercase;letter-spacing:.8px;margin:16px 0 6px;font-weight:600}
.slbl.ft{margin-top:0}
.fin{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--olv);background:var(--s1);color:var(--ob);font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;outline:none;transition:border-color .2s;margin-bottom:4px;box-sizing:border-box}
.fin:focus{border-color:var(--p);background:var(--sf)}
.fin::placeholder{color:var(--osv)}
.fsel{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--olv);background:var(--s1);color:var(--ob);font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;appearance:none;outline:none;margin-bottom:4px;box-sizing:border-box}
.bfill{width:100%;padding:14px;border-radius:28px;background:var(--p);color:#fff;border:none;font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;box-sizing:border-box}
.bfill:active{opacity:.85}
.bout{width:100%;padding:13px;border-radius:28px;background:transparent;border:1px solid var(--olv);color:var(--osv);font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;cursor:pointer;margin-top:8px;box-sizing:border-box}
.shop-del{padding:4px 10px;border:none;background:var(--cfb);color:var(--cf);border-radius:8px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;font-size:12px}
.shop-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--olv)}
.empty{text-align:center;padding:60px 24px}
.eico{font-size:52px;margin-bottom:12px;opacity:.4}
.etit{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;color:var(--ob);margin-bottom:6px}
.esub{font-size:13px;color:var(--osv)}
/* FB status bar */
.fb-status{display:flex;align-items:center;gap:6px;padding:4px 20px 6px;font-size:11px;color:var(--osv);font-family:'Fragment Mono',monospace}
.fb-dot{width:7px;height:7px;border-radius:50%;background:var(--olv);flex-shrink:0}
.fb-dot.ok{background:#059669}
.fb-dot.err{background:#dc2626}
.fb-dot.spin{background:#f59e0b;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app">
  <div class="tbar">
    <a href="../index.html" class="ihome">🏠</a>
    <div class="ttl">
      <div class="tlbl">FamilyHub</div>
      <div class="th">LISTE DE COURSES</div>
    </div>
    <button class="ibtn" data-action="openShopMgr" title="Gérer les magasins">🏪</button>
    <button class="ibtn" id="thbtn" data-action="toggleTheme">🌙</button>
  </div>

  <div class="fb-status" id="fbStatusBar">
    <div class="fb-dot" id="fbDot"></div>
    <span id="fbStatusTxt">Firebase non configuré</span>
  </div>

  <div class="qadd">
    <input class="qadd-in" id="qi" placeholder="Ajouter rapidement un article…">
  </div>
  <div class="prog-wrap" id="progWrap"></div>
  <div class="chips">
    <button class="chip sel" data-filter="all"  data-action="setFilter">Tout</button>
    <button class="chip"     data-filter="todo" data-action="setFilter">À acheter</button>
    <button class="chip"     data-filter="done" data-action="setFilter">Achetés</button>
    <button class="chip"     data-filter="g"    data-action="setFilter">Guillaume</button>
    <button class="chip"     data-filter="m"    data-action="setFilter">Michèle</button>
  </div>
  <div id="shopChips" class="shop-chips"></div>
  <div id="IL"></div>
</div>

<button class="fab" data-action="openAdd"><span style="pointer-events:none">＋</span></button>
<div class="toast" id="toast"></div>

<div class="sov" id="shAdd">
  <div id="shAddInner" style="background:var(--sf);border-radius:20px 20px 0 0;padding:28px 32px calc(var(--bot)+40px);width:100%;max-width:520px;box-sizing:border-box;max-height:92dvh;overflow-y:auto">
    <div style="width:32px;height:4px;background:var(--olv);border-radius:2px;margin:0 auto 20px;cursor:pointer" data-action="closeAdd"></div>
    <div class="shtit" id="shAddTitle">Ajouter un article</div>
    <div class="slbl ft">Article</div>
    <input class="fin" id="aNom" placeholder="Lait, pain, fromage…">
    <div class="slbl">Quantité</div>
    <input class="fin" id="aQty" placeholder="2 litres, 500g… (optionnel)">
    <div class="slbl">Ajouté par</div>
    <select class="fsel" id="aWho">
      <option value="Guillaume">Guillaume</option>
      <option value="Michele">Michèle</option>
    </select>
    <div class="slbl">Magasin</div>
    <select class="fsel" id="aShop"><option value="">— Choisir —</option></select>
    <div class="slbl" style="display:flex;justify-content:space-between;align-items:center">
      Note <span style="font-size:11px;color:var(--osv);text-transform:none">(optionnel)</span>
    </div>
    <input class="fin" id="aItemNote" placeholder="Marque, remarque…">
    <button class="bfill" data-action="saveItem">Enregistrer</button>
    <button class="bout"  data-action="closeAdd">Annuler</button>
  </div>
</div>

<div class="sov" id="shShops">
  <div style="background:var(--sf);border-radius:20px 20px 0 0;padding:28px 32px calc(var(--bot)+40px);width:100%;max-width:520px;box-sizing:border-box;max-height:92dvh;overflow-y:auto">
    <div style="width:32px;height:4px;background:var(--olv);border-radius:2px;margin:0 auto 20px;cursor:pointer" data-action="closeShops"></div>
    <div class="shtit">Mes magasins</div>
    <div class="slbl ft">Ajouter un magasin</div>
    <div style="display:flex;gap:8px">
      <input class="fin" id="newShopName" placeholder="Natureo, Picard…" style="margin-bottom:0;flex:1">
      <button class="bfill" data-action="addShop" style="width:auto;padding:14px 20px;margin-top:0">＋</button>
    </div>
    <div class="slbl" style="margin-top:16px">Liste actuelle</div>
    <div id="shopList"></div>
    <button class="bout" data-action="closeShops" style="margin-top:16px">Fermer</button>
  </div>
</div>

<script>
'use strict';
const SK       = 'fh_courses';
const SK_SHOPS = 'fh_shops';
const WHO_COLORS = {Guillaume:'#D7E3FF', Michele:'#ECDCFF'};
const WHO_TC     = {Guillaume:'#001849', Michele:'#1D0160'};

// ── Firebase ──────────────────────────────────────────────────────────────────
const FB_PROJECT = 'familyhub-colis-8abbd';
// CORRECTION : 'courses' au lieu de 'courses/items' pour respecter la règle des segments pairs (Collection -> Document)
const FB_COLL    = 'courses';

function getFBKey() {
  try {
    const s = JSON.parse(localStorage.getItem('lt_fb'));
    return s && s.apiKey ? s.apiKey : '';
  } catch { return ''; }
}

function fbUrl(path) {
  return 'https://firestore.googleapis.com/v1/projects/' + FB_PROJECT +
    '/databases/(default)/documents/' + path + '?key=' + getFBKey();
}

function setFbStatus(state, msg) {
  var dot = document.getElementById('fbDot');
  var txt = document.getElementById('fbStatusTxt');
  if (!dot || !txt) return;
  dot.className = 'fb-dot' + (state === 'ok' ? ' ok' : state === 'err' ? ' err' : state === 'spin' ? ' spin' : '');
  txt.textContent = msg || '';
}

async function testFirebase() {
  const key = getFBKey();
  if (!key) {
    setFbStatus('err', '❌ Clé API vide (locker-tracker ⟳ BDD)');
    return;
  }
  setFbStatus('spin', 'Test…');
  try {
    const r = await fetch(fbUrl(FB_COLL), {method: 'GET'});
    if (r.status === 401) {
      setFbStatus('err', '⚠️ Clé API invalide ou expirée');
    } else if (r.status === 403) {
      setFbStatus('err', '⚠️ Permissions insuffisantes (règles Firestore)');
    } else if (r.status === 400) {
      const errTxt = await r.text();
      setFbStatus('err', '⚠️ Erreur 400. Voir console.');
      console.error('Test Firebase 400:', errTxt);
    } else if (r.ok) {
      setFbStatus('ok', '✓ Firebase OK');
    } else {
      setFbStatus('err', 'HTTP ' + r.status);
    }
  } catch(e) {
    setFbStatus('err', 'Réseau: ' + e.message.substring(0, 20));
  }
}

function toFields(obj) {
  const f = {};
  for (const k in obj) {
    const v = obj[k];
    if (v === null || v === undefined) {
      f[k] = {nullValue: null};
    } else if (typeof v === 'boolean') {
      f[k] = {booleanValue: v};
    } else if (typeof v === 'number') {
      f[k] = Number.isInteger(v) ? {integerValue: String(v)} : {doubleValue: v};
    } else {
      f[k] = {stringValue: String(v)};
    }
  }
  return f;
}

function fromFields(fields) {
  if (!fields) return {};
  const obj = {};
  for (const k in fields) {
    const v = fields[k];
    if ('booleanValue' in v)      obj[k] = v.booleanValue;
    else if ('integerValue' in v) obj[k] = parseInt(v.integerValue);
    else if ('stringValue' in v)  obj[k] = v.stringValue;
    else obj[k] = null;
  }
  return obj;
}

function makeItemId(id) {
  return 'item_' + String(id);
}

async function fbWrite(item) {
  const key = getFBKey();
  if (!key) {
    setFbStatus('err', '❌ Clé API vide (locker-tracker ⟳ BDD)');
    return false;
  }
  const docId = item._fbId || makeItemId(item.id);
  item._fbId = docId;
  setFbStatus('spin', 'Sync…');
  
  const itemToSave = {};
  for (const k in item) {
    if (!k.startsWith('_')) {
      itemToSave[k] = item[k];
    }
  }
  
  try {
    const r = await fetch(fbUrl(FB_COLL + '/' + docId), {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({fields: toFields(itemToSave)})
    });
    
    if (!r.ok) {
      const errTxt = await r.text();
      let errMsg = errTxt;
      try { const errObj = JSON.parse(errTxt); if(errObj.error && errObj.error.message) errMsg = errObj.error.message; } catch(e){}
      setFbStatus('err', 'Firestore ' + r.status + ' (Voir Console)');
      console.error('fbWrite error details:', errMsg);
      return false;
    }
    setFbStatus('ok', 'Synchronisé ✓');
    return true;
  } catch(e) {
    setFbStatus('err', 'Réseau: ' + e.message.substring(0, 30));
    return false;
  }
}

async function fbDelete(id, fbId) {
  const key = getFBKey();
  if (!key) return false;
  const docId = fbId || makeItemId(id);
  try {
    await fetch(fbUrl(FB_COLL + '/' + docId), {method: 'DELETE'});
    return true;
  } catch(e) {
    console.warn('fbDelete', e);
    return false;
  }
}

async function fbLoadAll() {
  const key = getFBKey();
  if (!key) {
    setFbStatus('', 'Firebase non configuré');
    return null;
  }
  setFbStatus('spin', 'Chargement…');
  try {
    const r = await fetch(fbUrl(FB_COLL));
    if (!r.ok) {
      const errTxt = await r.text();
      setFbStatus('err', 'Firestore ' + r.status + ' — ' + errTxt.substring(0,20));
      return null;
    }
    const data = await r.json();
    const docs = (data.documents || [])
      .map(doc => {
        const obj = fromFields(doc.fields);
        obj._fbId = doc.name.split('/').pop();
        if (!obj.id && obj._fbId && obj._fbId.startsWith('item_')) {
          obj.id = parseInt(obj._fbId.replace('item_', '')) || obj._fbId;
        }
        return obj;
      })
      // On filtre pour ne garder que les documents "items" (évite de charger magasins_config comme un produit)
      .filter(obj => obj._fbId && obj._fbId.startsWith('item_'));
      
    setFbStatus('ok', docs.length + ' articles Firebase');
    return docs;
  } catch(e) {
    setFbStatus('err', 'Erreur: ' + e.message);
    return null;
  }
}

// ── NOUVEAU : Synchronisation des magasins ────────────────────────────────────
async function fbWriteShops(shopsArray) {
  const key = getFBKey();
  if (!key) return;
  const fields = { list: { arrayValue: { values: shopsArray.map(s => ({stringValue: s})) } } };
  try {
    const r = await fetch(fbUrl(FB_COLL + '/magasins_config'), {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({fields: fields})
    });
    if(!r.ok) {
      const err = await r.text();
      console.error("Erreur sync magasins", err);
    }
  } catch(e) {
    console.error("Network error sync magasins", e);
  }
}

async function fbLoadShopsRemote() {
  const key = getFBKey();
  if (!key) return null;
  try {
    const r = await fetch(fbUrl(FB_COLL + '/magasins_config'));
    if (r.ok) {
      const data = await r.json();
      if (data.fields && data.fields.list && data.fields.list.arrayValue && data.fields.list.arrayValue.values) {
        return data.fields.list.arrayValue.values.map(v => v.stringValue);
      } else if (data.fields && data.fields.list && data.fields.list.arrayValue && !data.fields.list.arrayValue.values) {
        return [];
      }
    }
  } catch(e) {
    console.warn("Erreur chargement magasins distants", e);
  }
  return null;
}

// ── State ─────────────────────────────────────────────────────────────────────
let D       = loadD();
let shops   = loadShops();
let shopFlt = 'all';
let flt     = 'all';
let editId  = null;
let _tt;

function loadD() {
  try { const d = JSON.parse(localStorage.getItem(SK)); if (d && d.items) return d; } catch(e) {}
  return {items: [], nextId: 1};
}
function saveD(d) { localStorage.setItem(SK, JSON.stringify(d)); }
function loadShops() {
  try { const s = JSON.parse(localStorage.getItem(SK_SHOPS)); if (Array.isArray(s)) return s; } catch(e) {}
  return ['Carrefour','Super U','Picard','Natureo','Lidl','Biocoop'];
}
function saveShops(s) { shops = s; localStorage.setItem(SK_SHOPS, JSON.stringify(s)); fbWriteShops(s); }

// ── Actions ───────────────────────────────────────────────────────────────────
function quickAdd() {
  const el = document.getElementById('qi');
  const v = el.value.trim(); if (!v) return;
  const item = {
    id: D.nextId++,
    nom: v, qty: '', who: 'Guillaume', shop: '', note: '',
    done: false, date: new Date().toISOString()
  };
  item._fbId = makeItemId(item.id);
  D.items.push(item);
  saveD(D); render(); el.value = '';
  fbWrite(item).then(ok => { if (!ok && getFBKey()) showToast('⚠️ Sync Firebase échouée'); });
  showToast('✓ Ajouté');
}

function openAddSheet() {
  editId = null;
  document.getElementById('shAddTitle').textContent = 'Ajouter un article';
  document.getElementById('aNom').value = '';
  document.getElementById('aQty').value = '';
  document.getElementById('aWho').value = 'Guillaume';
  document.getElementById('aItemNote').value = '';
  rebuildShopSelect('');
  openSheet('shAdd');
}

function rebuildShopSelect(selected) {
  const el = document.getElementById('aShop');
  if (!el) return;
  el.innerHTML = '<option value="">— Choisir un magasin —</option>' +
    shops.map(s => '<option value="'+s+'"'+(s===selected?' selected':'')+'>'+s+'</option>').join('');
}

function openEditSheet(id) {
  const item = D.items.find(x => x.id === id); if (!item) return;
  editId = id;
  document.getElementById('shAddTitle').textContent = 'Modifier l\'article';
  document.getElementById('aNom').value = item.nom;
  document.getElementById('aQty').value = item.qty || '';
  document.getElementById('aWho').value = item.who;
  document.getElementById('aItemNote').value = item.note || '';
  rebuildShopSelect(item.shop || '');
  openSheet('shAdd');
}

function saveItem() {
  const nom = document.getElementById('aNom').value.trim();
  if (!nom) { showToast('⚠️ Saisissez un article'); return; }
  const qty  = document.getElementById('aQty').value.trim();
  const who  = document.getElementById('aWho').value;
  const note = document.getElementById('aItemNote').value.trim();
  const shop = document.getElementById('aShop').value;
  if (!shop) { showToast('⚠️ Sélectionnez un magasin'); return; }

  if (editId !== null) {
    const item = D.items.find(x => x.id === editId); if (!item) return;
    item.nom = nom; item.qty = qty; item.who = who; item.note = note; item.shop = shop;
    if (!item._fbId) item._fbId = makeItemId(item.id);
    fbWrite(item);
    showToast('✓ Article modifié');
  } else {
    const item = {
      id: D.nextId++, nom, qty, who, note, shop,
      done: false, date: new Date().toISOString()
    };
    item._fbId = makeItemId(item.id);
    D.items.push(item);
    fbWrite(item);
    showToast('✓ Ajouté à la liste');
  }
  saveD(D); render(); closeSheet('shAdd');
}

function toggleItem(id) {
  const t = D.items.find(x => x.id === id); if (!t) return;
  t.done = !t.done;
  saveD(D); render();
  fbWrite(t);
}

function delItem(id) {
  const item = D.items.find(x => x.id === id);
  D.items = D.items.filter(x => x.id !== id);
  saveD(D); render();
  fbDelete(id, item && item._fbId);
}

function clearDone() {
  const n = D.items.filter(x => x.done).length; if (!n) return;
  if (confirm('Supprimer les ' + n + ' article(s) achetés ?')) {
    const toDel = D.items.filter(x => x.done);
    D.items = D.items.filter(x => !x.done);
    saveD(D); render();
    toDel.forEach(item => fbDelete(item.id, item._fbId));
    showToast('✓ ' + n + ' article(s) supprimés');
  }
}

// ── Filtrage & rendu ──────────────────────────────────────────────────────────
function getFilt() {
  let items = [...D.items];
  if      (flt === 'todo') items = items.filter(x => !x.done);
  else if (flt === 'done') items = items.filter(x =>  x.done);
  else if (flt === 'g')    items = items.filter(x => x.who === 'Guillaume');
  else if (flt === 'm')    items = items.filter(x => x.who === 'Michele');
  if (shopFlt !== 'all')   items = items.filter(x => x.shop === shopFlt);
  return items;
}

function renderProg() {
  const total = D.items.length;
  const done  = D.items.filter(x => x.done).length;
  if (!total) { document.getElementById('progWrap').innerHTML = ''; return; }
  const pct = Math.round(done / total * 100);
  document.getElementById('progWrap').innerHTML =
    '<div class="prog-lbl"><span>'+done+'/'+total+' articles</span><span>'+pct+'%</span></div>' +
    '<div class="prog-bar"><div class="prog-fill" style="width:'+pct+'%"></div></div>';
}

function render() {
  renderProg();
  const items = getFilt();
  const el = document.getElementById('IL');
  if (!items.length) {
    el.innerHTML = '<div class="ilist"><div class="empty"><div class="eico">🛒</div>' +
      '<div class="etit">'+(flt==='done'?'Aucun achat':'Liste vide')+'</div>' +
      '<div class="esub">Appuyez sur + pour ajouter un article</div></div></div>';
    return;
  }
  items.sort((a,b) => a.done - b.done);
  const doneCnt = items.filter(x => x.done).length;
  let html = '<div class="ilist">';
  items.forEach((item, i) => {
    html += '<div class="icard'+(item.done?' done':'')+'" data-action="toggleItem" data-id="'+item.id+'" style="animation-delay:'+i*.02+'s">' +
      '<div class="chk'+(item.done?' done':'')+'">'+
        (item.done?'<span style="color:#fff;font-size:12px">✓</span>':'')+
      '</div>'+
      '<div class="ibody">'+
        '<div class="iname">'+item.nom+'</div>'+
        (item.qty?'<div class="iqty">'+item.qty+'</div>':'')+
      '</div>'+
      '<span class="iwho" style="background:'+(WHO_COLORS[item.who]||'#E6EBF0')+';color:'+(WHO_TC[item.who]||'#42474C')+'">'+(item.who==='Michele'?'M':'G')+'</span>'+
      '<div class="icard-actions">'+
        '<button class="icard-btn" data-action="editItem" data-id="'+item.id+'" title="Modifier">✏️</button>'+
        '<button class="icard-btn" data-action="delItem"  data-id="'+item.id+'" title="Supprimer">🗑</button>'+
      '</div>'+
    '</div>';
  });
  html += '</div>';
  if (doneCnt > 0) {
    html += '<button data-action="clearDone" style="display:flex;align-items:center;justify-content:center;margin:10px 14px;padding:11px;border-radius:14px;border:1px solid var(--olv);background:transparent;color:var(--osv);font-family:\'Plus Jakarta Sans\',sans-serif;font-size:13px;cursor:pointer;width:calc(100% - 28px)">🗑 Supprimer les '+doneCnt+' article(s) achetés</button>';
  }
  el.innerHTML = html;
}

function renderShopChips() {
  const el = document.getElementById('shopChips');
  if (!el) return;
  el.innerHTML = '<button class="shop-chip'+(shopFlt==='all'?' sel':'')+'" data-action="setShopFilter" data-shop="all">Tous 🏪</button>' +
    shops.map(s => '<button class="shop-chip'+(shopFlt===s?' sel':'')+'" data-action="setShopFilter" data-shop="'+s+'">'+s+'</button>').join('');
  const ml = document.getElementById('shopList');
  if (ml) {
    ml.innerHTML = shops.map(s =>
      '<div class="shop-item"><span>'+s+'</span><button class="shop-del" data-action="delShop" data-shop="'+s+'">✕</button></div>'
    ).join('');
  }
}

// ── Sheet helpers ─────────────────────────────────────────────────────────────
function openSheet(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;';
  void el.offsetHeight;
  try { document.body.style.overflow = 'hidden'; } catch(e) {}
}
function closeSheet(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.style.display = 'none';
  try { document.body.style.overflow = ''; } catch(e) {}
}

function showToast(m) {
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(() => t.classList.remove('show'), 3000);
}

function findAction(elem) {
  var el = elem;
  while (el && el !== document) {
    if (el.nodeType === 1 && el.getAttribute && el.getAttribute('data-action')) return el;
    el = el.parentNode;
  }
  return null;
}

// ── Dispatcher ────────────────────────────────────────────────────────────────
document.addEventListener('click', function(e) {
  const el = findAction(e.target); if (!el) return;
  const action = el.getAttribute('data-action');
  const ds = el.dataset;

  switch (action) {
    case 'toggleTheme': window.toggleTheme && window.toggleTheme(); break;
    case 'openAdd':     openAddSheet(); break;
    case 'closeAdd':    closeSheet('shAdd'); break;
    case 'openShopMgr': renderShopChips(); openSheet('shShops'); break;
    case 'closeShops':  closeSheet('shShops'); break;
    case 'setFilter':
      flt = ds.filter || 'all';
      document.querySelectorAll('.chip').forEach(b => b.classList.remove('sel'));
      el.classList.add('sel'); render(); break;
    case 'saveItem':    saveItem(); break;
    case 'toggleItem':  toggleItem(parseInt(ds.id)); break;
    case 'editItem':
      e.stopPropagation();
      openEditSheet(parseInt(ds.id)); break;
    case 'delItem':
      e.stopPropagation();
      delItem(parseInt(ds.id)); break;
    case 'clearDone':   clearDone(); break;
    case 'setShopFilter':
      shopFlt = ds.shop || 'all';
      document.querySelectorAll('.shop-chip').forEach(b => b.classList.remove('sel'));
      el.classList.add('sel'); render(); break;
    case 'addShop': {
      const sv = document.getElementById('newShopName');
      if (sv) {
        const sn = sv.value.trim();
        if (sn && !shops.includes(sn)) { shops.push(sn); saveShops(shops); renderShopChips(); sv.value = ''; showToast('✓ Magasin ajouté'); }
        else showToast(sn ? 'Magasin déjà présent' : '⚠️ Saisissez un nom');
      }
      break;
    }
    case 'delShop': {
      shops = shops.filter(x => x !== ds.shop); saveShops(shops); renderShopChips(); render(); showToast('Magasin supprimé');
      break;
    }
  }
});

document.addEventListener('click', function(e) {
  if (e.target && e.target.classList && e.target.classList.contains('sov')) closeSheet(e.target.id);
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && e.target.id === 'qi') quickAdd();
});

// ── NOUVEAU : Création du 1er jeu de données bidon ─────────────────────────────
async function injectMockData() {
  const mockItems = [
    { id: 1, nom: "Pommes Gala", qty: "1kg", who: "Guillaume", shop: "Carrefour", note: "Si possible", done: false, date: new Date().toISOString() },
    { id: 2, nom: "Lait demi-écrémé", qty: "2L", who: "Michele", shop: "Super U", note: "", done: false, date: new Date().toISOString() }
  ];
  for (let it of mockItems) {
    it._fbId = makeItemId(it.id);
    D.items.push(it);
    await fbWrite(it);
  }
  D.nextId = 3;
  saveD(D);
  render();
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  document.querySelectorAll('.sov').forEach(el => { el.style.display = 'none'; });
  renderShopChips();
  render();

  if (window.FHTheme) {
    const cur = document.documentElement.getAttribute('data-theme') || 'light';
    const btn = document.getElementById('thbtn');
    if (btn) btn.textContent = cur === 'dark' ? '🌙' : cur === 'sepia' ? '📜' : '☀️';
  }

  await testFirebase();

  const key = getFBKey();
  if (key) {
    // 1. Sync des magasins
    const remoteShops = await fbLoadShopsRemote();
    if (remoteShops && remoteShops.length > 0) {
      shops = remoteShops;
      localStorage.setItem(SK_SHOPS, JSON.stringify(shops));
      renderShopChips();
    } else {
      // Pousse la config locale vers Firebase si aucune présente
      fbWriteShops(shops);
    }

    // 2. Sync des articles
    const remote = await fbLoadAll();
    if (remote && remote.length > 0) {
      const localMap = {};
      D.items.forEach(t => {
        const key = t._fbId || makeItemId(t.id);
        t._fbId = key;
        localMap[key] = t;
      });
      remote.forEach(t => {
        if (!t._fbId) return;
        if (!t.id && t._fbId.startsWith('item_')) {
          const numPart = t._fbId.replace('item_', '');
          t.id = parseInt(numPart) || t._fbId;
        }
        if (localMap[t._fbId]) {
          Object.assign(localMap[t._fbId], t);
        } else {
          localMap[t._fbId] = t;
        }
      });
      D.items = Object.values(localMap).filter(x => x.nom).sort((a,b) => new Date(b.date||0) - new Date(a.date||0));
      const maxId = D.items.reduce((m, t) => {
        const n = typeof t.id === 'number' ? t.id : 0;
        return Math.max(m, n);
      }, 0);
      D.nextId = Math.max(D.nextId, maxId + 1);
      saveD(D); render();
    } else if (D.items.length === 0) {
      // 3. Injection du jeu de données bidon si TOUT est vide
      setFbStatus('spin', 'Création jeu d\'essai…');
      await injectMockData();
    }
  }
}
init();
</script>
