<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suivi Colis - DEBUG</title>
  <style>
    :root {
      --c-primary: #8B7355;
      --c-bg: #f5f1ed;
      --c-card: #ffffff;
      --c-border: #e8e3dd;
      --c-text: #3a3a3a;
      --c-light-text: #7a7a7a;
      --c-success: #7cb342;
      --c-warning: #fb8c00;
      --c-danger: #e53935;
      --osv: "Phase 3.0";
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--c-bg); color: var(--c-text); }
    
    /* DEBUG BOX - PROMINENT */
    #debug-box {
      background: #ffcccc;
      border: 3px solid #ff0000;
      padding: 15px;
      margin: 10px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
      color: #000;
      z-index: 9999;
    }
    
    .debug-line {
      padding: 5px;
      border-bottom: 1px solid #ffaaaa;
    }
    
    .debug-line.error { color: #ff0000; font-weight: bold; }
    .debug-line.ok { color: #00aa00; font-weight: bold; }
    .debug-line.info { color: #0066ff; }
    
    header {
      background: var(--c-primary);
      color: white;
      padding: 15px;
      text-align: center;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    header h1 { font-size: 20px; font-family: 'Bebas Neue'; }
    
    .header-date { font-size: 12px; opacity: 0.9; }
    
    footer {
      background: var(--c-primary);
      color: white;
      padding: 10px;
      text-align: center;
      font-size: 11px;
      margin-top: 20px;
    }
    
    .container { padding: 15px; }
    
    .status-msg {
      background: var(--c-card);
      border-left: 4px solid var(--c-primary);
      padding: 15px;
      margin: 15px 0;
      border-radius: 4px;
      text-align: center;
    }
  </style>
</head>
<body>

<!-- DEBUG BOX AT TOP -->
<div id="debug-box">
  <div class="debug-line info">🔍 DEBUG MODE ACTIF</div>
  <div class="debug-line">Chargement en cours...</div>
</div>

<header>
  <h1>📦 SUIVI COLIS</h1>
  <div class="header-date" id="header-date"></div>
</header>

<div class="container">
  <div class="status-msg" id="status-msg">
    ⏳ Initialisation...
  </div>
</div>

<footer>
  Guillaume & Michèle • v<span id="version"></span> • 
  <span id="sync-status">Vérification connexion...</span>
</footer>

<script>
// ============ DEBUG LOGGER ============
const debugLog = {
  lines: [],
  box: document.getElementById('debug-box'),
  
  add(msg, type = 'info') {
    const line = document.createElement('div');
    line.className = 'debug-line ' + type;
    
    const time = new Date().toLocaleTimeString();
    let icon = '❓';
    if (type === 'error') icon = '❌';
    if (type === 'ok') icon = '✅';
    if (type === 'info') icon = 'ℹ️';
    
    line.textContent = `[${time}] ${icon} ${msg}`;
    this.box.appendChild(line);
    this.box.scrollTop = this.box.scrollHeight;
  }
};

debugLog.add('DEBUG MODE activé');

// ============ TEST 1: PATHS ============
debugLog.add('Test 1: Vérification chemins');
debugLog.add(`URL actuelle: ${window.location.href}`, 'info');
debugLog.add(`Chemin: ${window.location.pathname}`, 'info');

// ============ TEST 2: FIREBASE SYNC ============
debugLog.add('Test 2: Chargement firebaseSync.js');

const firebaseSyncScript = document.createElement('script');
firebaseSyncScript.src = '../firebaseSync.js';
firebaseSyncScript.onload = () => {
  debugLog.add('firebaseSync.js chargé avec succès', 'ok');
  
  // Vérifier la fonction
  if (typeof fbCreateSyncHandler !== 'undefined') {
    debugLog.add('fbCreateSyncHandler() disponible', 'ok');
  } else {
    debugLog.add('fbCreateSyncHandler() NOT FOUND', 'error');
  }
};
firebaseSyncScript.onerror = () => {
  debugLog.add('ERREUR: Impossible de charger ../firebaseSync.js', 'error');
  debugLog.add('Vérifier que le fichier existe en racine', 'error');
};
document.head.appendChild(firebaseSyncScript);

// ============ TEST 3: LOCALSTORAGE ============
setTimeout(() => {
  debugLog.add('Test 3: LocalStorage');
  
  const fbConfig = localStorage.getItem('lt_fb');
  if (fbConfig) {
    debugLog.add('Firebase config trouvé: ' + fbConfig.substring(0, 40) + '...', 'ok');
  } else {
    debugLog.add('ATTENTION: Pas de config Firebase dans localStorage', 'error');
  }
  
  const theme = localStorage.getItem('theme');
  debugLog.add('Thème: ' + (theme || 'clair'), 'info');
  
}, 500);

// ============ TEST 4: FIRESTORE DATA ============
setTimeout(() => {
  debugLog.add('Test 4: Chargement données Firestore');
  
  const fbConfig = localStorage.getItem('lt_fb');
  if (!fbConfig) {
    debugLog.add('ERREUR: Pas de config, impossible de charger Firestore', 'error');
    document.getElementById('status-msg').innerHTML = '❌ Erreur: Config Firebase manquante<br><small>Vérifier localStorage("lt_fb")</small>';
    return;
  }
  
  try {
    const config = JSON.parse(fbConfig);
    debugLog.add('Config Firebase valide', 'ok');
    
    // Essayer de charger les colis
    fetch(`https://firestore.googleapis.com/v1/projects/${config.projectId}/databases/(default)/documents/meta/colis/items`, {
      headers: { 'Authorization': `Bearer ${config.apiKey}` }
    })
    .then(r => {
      debugLog.add(`Firestore réponse: ${r.status}`, r.status === 200 ? 'ok' : 'error');
      return r.json();
    })
    .then(data => {
      debugLog.add(`Documents reçus: ${data.documents?.length || 0}`, 'ok');
      document.getElementById('status-msg').innerHTML = '✅ Données chargées<br><small>Voir debug box pour détails</small>';
    })
    .catch(err => {
      debugLog.add(`Firestore erreur: ${err.message}`, 'error');
      document.getElementById('status-msg').innerHTML = '❌ Erreur Firestore<br><small>' + err.message + '</small>';
    });
    
  } catch (e) {
    debugLog.add('Config Firebase invalide (JSON parse error)', 'error');
    debugLog.add(e.message, 'error');
  }
}, 1000);

// ============ HEADER ============
document.getElementById('header-date').textContent = new Date().toLocaleDateString('fr-FR');
document.getElementById('version').textContent = 'DEBUG';
document.getElementById('sync-status').textContent = '🔍 Mode Debug';

// ============ INSTRUCTIONS ============
setTimeout(() => {
  debugLog.add('═══════════════════════════════════', 'info');
  debugLog.add('ACTIONS À FAIRE:', 'info');
  debugLog.add('1. Lire tous les logs ci-dessus', 'info');
  debugLog.add('2. Chercher les ❌ (erreurs)', 'info');
  debugLog.add('3. Screenshot et envoyer', 'info');
  debugLog.add('═══════════════════════════════════', 'info');
}, 2000);

</script>

</body>
</html>
