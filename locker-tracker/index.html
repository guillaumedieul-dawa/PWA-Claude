<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suivi Colis</title>
  <script src="../firebaseSync.js"></script>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="../icons/home-192.png">
  <style>
    :root { --c-primary:#f39c12;--c-bg:#f5f1ed;--c-card:#fff;--c-border:#e8e3dd;--c-text:#3a3a3a;--c-light-text:#7a7a7a;--c-danger:#e53935;--c-success:#27ae60; }
    :root.dark { --c-bg:#1a1a1a;--c-card:#2d2d2d;--c-border:#444;--c-text:#f0f0f0;--c-light-text:#aaa; }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:sans-serif;background:var(--c-bg);color:var(--c-text);transition:.3s;}
    header{background:var(--c-primary);color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center;}
    header h1{font-size:20px;font-weight:bold;}
    .hc{display:flex;gap:10px;}
    button{background:var(--c-primary);color:#fff;border:none;padding:8px 12px;border-radius:4px;cursor:pointer;font-size:14px;}
    .container{padding:15px;}
    .filters{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap;}
    .filter-btn{padding:8px 12px;border:1px solid var(--c-border);background:var(--c-card);color:var(--c-text);border-radius:20px;cursor:pointer;}
    .filter-btn.active{background:var(--c-primary);color:#fff;border-color:var(--c-primary);}
    .packages-list{display:flex;flex-direction:column;gap:10px;}
    .package-item{background:var(--c-card);border-left:4px solid var(--c-primary);padding:15px;border-radius:4px;display:flex;justify-content:space-between;align-items:flex-start;}
    .package-item.delivered{border-left-color:var(--c-success);opacity:.7;}
    .package-info{flex:1;}
    .package-name{font-weight:bold;margin-bottom:5px;}
    .package-tracking{font-size:12px;color:var(--c-light-text);margin-bottom:3px;}
    .package-status{font-size:11px;padding:3px 8px;background:var(--c-primary);color:#fff;border-radius:10px;display:inline-block;}
    .package-status.delivered{background:var(--c-success);}
    .package-delete{background:var(--c-danger);color:#fff;border:none;padding:6px 10px;border-radius:4px;cursor:pointer;}
    .fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;background:var(--c-primary);color:#fff;border:none;border-radius:50%;font-size:28px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.3);}
    .sheet{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--c-card);padding:20px;border-radius:12px 12px 0 0;z-index:1000;flex-direction:column;gap:10px;}
    .sheet input,.sheet select{padding:10px;border:1px solid var(--c-border);border-radius:4px;width:100%;background:var(--c-bg);color:var(--c-text);}
    .sheet-close{background:var(--c-danger);align-self:flex-end;}
    footer{background:var(--c-primary);color:#fff;padding:10px;text-align:center;font-size:11px;margin-top:60px;}
  </style>
</head>
<body>
<header>
  <h1>📦 SUIVI COLIS</h1>
  <div class="hc">
    <button data-action="home">🏠</button>
    <button data-action="toggle-theme">🌙</button>
  </div>
</header>
<div class="container">
  <div class="filters">
    <button class="filter-btn active" data-action="filter-all">Tous</button>
    <button class="filter-btn" data-action="filter-pending">En attente</button>
    <button class="filter-btn" data-action="filter-delivered">Livrés</button>
  </div>
  <div class="packages-list" id="packagesList"></div>
</div>
<button class="fab" data-action="add-package">+</button>
<div class="sheet" id="add-package-sheet">
  <button class="sheet-close" data-action="close-sheet">✕</button>
  <h3>Ajouter un colis</h3>
  <input type="text" id="packageName" placeholder="Nom du colis">
  <input type="text" id="packageTracking" placeholder="Numéro de suivi">
  <select id="packageCarrier">
    <option>La Poste</option><option>Chronopost</option><option>DPD</option>
    <option>UPS</option><option>Mondial Relay</option><option>Autre</option>
  </select>
  <button data-action="save-package">✓ Ajouter</button>
</div>
<footer>Guillaume &amp; Michèle • v<span id="version"></span> • 🟢 Sync OK</footer>
<script>
var allPackages=[], currentFilter='all', packagesSync=null;
(function(){if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');})();
document.getElementById('version').textContent='P3.1';
function findAction(e){while(e&&e!==document.body){if(e.dataset&&e.dataset.action)return e;e=e.parentElement;}return null;}
function openSheet(id){var s=document.getElementById(id);if(s)s.style.cssText='display:flex;flex-direction:column;gap:10px;';}
function closeSheet(id){var s=document.getElementById(id);if(s)s.style.cssText='display:none;';}
function renderPackages(){
  var c=document.getElementById('packagesList');
  var f=allPackages.filter(function(p){return currentFilter==='all'?true:currentFilter==='pending'?!p.delivered:p.delivered;});
  if(!f.length){c.innerHTML='<p style="text-align:center;padding:40px;color:var(--c-light-text)">Aucun colis</p>';return;}
  c.innerHTML=f.map(function(p){return'<div class="package-item'+(p.delivered?' delivered':'')+'"><div class="package-info"><div class="package-name">'+(p.name||'Sans nom')+'</div><div class="package-tracking">'+(p.tracking||'')+'</div><div class="package-status'+(p.delivered?' delivered':'')+'">'+( p.delivered?'✓ Livré':'⏳ En cours')+'</div></div><button class="package-delete" data-action="delete-pkg" data-id="'+p.id+'">✕</button></div>';}).join('');
}
document.addEventListener('click',function(e){
  var btn=findAction(e.target);if(!btn)return;
  var a=btn.dataset.action;
  if(a==='home'){window.location.href='/';return;}
  if(a==='toggle-theme'){var r=document.documentElement;r.classList.toggle('dark');void r.offsetHeight;localStorage.setItem('theme',r.classList.contains('dark')?'dark':'light');return;}
  if(a==='filter-all'||a==='filter-pending'||a==='filter-delivered'){currentFilter=a.replace('filter-','');document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');renderPackages();return;}
  if(a==='add-package'){openSheet('add-package-sheet');return;}
  if(a==='close-sheet'){var sh=btn.parentElement;while(sh&&!sh.classList.contains('sheet'))sh=sh.parentElement;if(sh)closeSheet(sh.id);return;}
  if(a==='save-package'){saveNewPackage();return;}
  if(a==='delete-pkg'){deletePackage(btn.dataset.id);return;}
});
window.addEventListener('load',function(){
  var fn=(typeof fbCreateSyncHandler!=='undefined')?fbCreateSyncHandler:(window.FBSync&&window.FBSync.fbCreateSyncHandler)||null;
  if(fn){packagesSync=fn('meta/colis');loadPackages();}else{renderPackages();}
});
async function loadPackages(){try{allPackages=(await packagesSync.readAll())||[];}catch(e){allPackages=[];}renderPackages();}
async function saveNewPackage(){
  var n=(document.getElementById('packageName').value||'').trim();if(!n){alert('Nom requis');return;}
  var p={id:Date.now().toString(),name:n,tracking:document.getElementById('packageTracking').value||'',carrier:document.getElementById('packageCarrier').value||'',delivered:false,createdAt:new Date().toISOString()};
  if(packagesSync)try{await packagesSync.write(p.id,p);}catch(e){console.warn(e);}
  allPackages.push(p);renderPackages();closeSheet('add-package-sheet');
  document.getElementById('packageName').value='';document.getElementById('packageTracking').value='';
}
async function deletePackage(id){
  if(!id)return;
  if(packagesSync)try{await packagesSync.delete(id);}catch(e){console.warn(e);}
  allPackages=allPackages.filter(function(p){return p.id!==id;});renderPackages();
}
</script>
</body>
</html>
