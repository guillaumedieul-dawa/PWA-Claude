<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf7f2">
<meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#1a1714">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Colis">
<title>Suivi Colis</title>
<link rel="manifest" href="./manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fragment+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="../fbSync.js"></script>
<style>
:root{--p:#2563eb;--op:#fff;--pc:#dbeafe;--opc:#1e3a8a;--s:#059669;--sc:#d1fae5;--t:#7c3aed;--tc:#ede9fe;--err:#9f1239;--ec:#ffe4e6;--bg:#faf7f2;--sf:#fff;--s1:#f0ebe2;--s2:#e8e2d8;--olv:#e0d9cf;--ob:#1c1410;--os:#1c1410;--osv:#7a6a5a;--sh:rgba(0,0,0,.05);--cf:#9f1239;--cfb:#ffe4e6;--cr:#065f46;--crb:#d1fae5;--cd:#065f46;--cdb:#d1fae5;--co:#92400e;--cob:#fef3c7;--cpd:#92400e;--cpdb:#fef3c7;--cx:#6b7280;--cxb:#f3f4f6;--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);--rl:20px;--rm:16px;--rs:12px}
[data-theme="dark"]{--p:#60a5fa;--op:#1e3a8a;--pc:#1e3a8a;--opc:#dbeafe;--s:#34d399;--sc:#064e3b;--t:#a78bfa;--tc:#2e1065;--err:#fca5a5;--ec:#450a0a;--bg:#1a1714;--sf:#231e1a;--s1:#2c2620;--s2:#352e27;--olv:#3e352d;--ob:#f0ebe2;--os:#f0ebe2;--osv:#a09080;--sh:rgba(0,0,0,.3);--cf:#fca5a5;--cfb:#450a0a;--cr:#6ee7b7;--crb:#022c22;--cd:#6ee7b7;--cdb:#022c22;--co:#fcd34d;--cob:#451a03;--cpd:#fcd34d;--cpdb:#451a03;--cx:#9ca3af;--cxb:#1f2937}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100dvh;background:var(--bg);color:var(--ob);font-family:'Plus Jakarta Sans',sans-serif;overflow-x:hidden;transition:background .3s,color .3s}
#app{max-width:520px;margin:0 auto;min-height:100dvh;padding-bottom:calc(var(--bot) + 96px)}
.tbar{position:sticky;top:0;z-index:100;background:var(--bg);padding:calc(var(--top) + 12px) 16px 8px;display:flex;align-items:center;gap:8px}
.ihome{width:40px;height:40px;border-radius:50%;border:none;background:var(--s1);color:var(--os);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;flex-shrink:0;transition:background .2s}
.ihome:active{background:var(--s2)}
.ttl{flex:1;min-width:0}
.tlbl{font-size:10px;color:var(--osv);letter-spacing:.3px;font-weight:500}
.th{font-family:'Bebas Neue',sans-serif!important;font-size:26px!important;letter-spacing:2px!important;color:var(--ob);line-height:1}
.ibtn{width:40px;height:40px;border-radius:50%;border:none;background:var(--s1);color:var(--os);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .2s;position:relative;padding:0}
.ibtn:active{background:var(--s2)}
.ndot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:#059669;border:2px solid var(--bg)}
.swrap{padding:8px 16px 4px;position:relative}
.sfield{width:100%;padding:11px 16px 11px 44px;border-radius:28px;border:1px solid var(--olv);background:var(--sf);color:var(--ob);font-family:'Plus Jakarta Sans',sans-serif;font-size:16px;outline:none;box-sizing:border-box}
.sfield:focus{background:var(--s2)}
.sfield::placeholder{color:var(--osv)}
.search-ico{position:absolute;left:28px;top:50%;transform:translateY(-50%);color:var(--osv);font-size:18px;pointer-events:none}
.chips{display:flex;gap:8px;padding:8px 16px 12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 14px;border-radius:8px;border:1px solid var(--olv);background:transparent;color:var(--osv);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;cursor:pointer;white-space:nowrap;transition:all .2s;display:flex;align-items:center;gap:6px}
.chip.sel{background:var(--pc);border-color:var(--pc);color:var(--opc);font-weight:500}
.chip:active{opacity:.75}
.cn{border-radius:10px;font-size:11px;padding:1px 7px;font-weight:700}
.chip.sel .cn{background:var(--opc);color:var(--pc)}
.chip:not(.sel) .cn{background:var(--s2);color:var(--osv)}
.plist{display:flex;flex-direction:column;gap:8px;padding:0 12px}
.pcard{background:var(--sf);border-radius:var(--rl);overflow:hidden;cursor:pointer;box-shadow:0 1px 3px var(--sh);transition:box-shadow .2s,transform .15s;border:1px solid transparent;animation:fu .3s ease both;user-select:none;-webkit-user-select:none}
.pcard:active{transform:scale(0.98)}
.pcard.open{box-shadow:0 3px 8px var(--sh);border-color:var(--olv)}
.ptint{height:4px;width:100%}
.phdr{padding:12px 16px 10px;display:flex;align-items:flex-start;gap:12px}
.cbadge{width:44px;height:44px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px}
.pht{flex:1;min-width:0}
.pcname{font-family:'Plus Jakarta Sans',sans-serif;font-size:16px;font-weight:700;color:var(--os);line-height:1.2}
.pinline{font-size:12px;color:var(--p);font-family:'Fragment Mono',monospace;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.pmeta{font-size:12px;color:var(--osv);margin-top:2px}
.schip{padding:4px 12px;border-radius:8px;font-size:12px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:500;white-space:nowrap;flex-shrink:0;margin-top:2px}
.sr{background:var(--crb);color:var(--cr)} .sp{background:var(--cpdb);color:var(--cpd)}
.so{background:var(--cob);color:var(--co)} .sd{background:var(--cdb);color:var(--cd)}
.sf2{background:var(--cfb);color:var(--cf)} .sx{background:var(--cxb);color:var(--cx)}
.pbdy{padding:0 16px 14px}
.div{height:1px;background:var(--olv);margin:0 -16px 12px;opacity:.4}
.flbl{font-size:11px;color:var(--osv);letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px;font-family:'Plus Jakarta Sans',sans-serif}
.frow{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.fval{font-family:'Fragment Mono',monospace;font-size:14px;color:var(--p);font-weight:500;flex:1;word-break:break-all}
.cfab{width:32px;height:32px;border-radius:50%;border:none;background:var(--pc);color:var(--opc);font-size:14px;display:flex;align-items:center;justify-content:center;padding:16px;margin-bottom:12px}
.cblbl{font-size:11px;color:var(--opc);opacity:.7;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;font-family:'Plus Jakarta Sans',sans-serif}
.cbrow{display:flex;align-items:center;gap:8px}
.cbval{font-family:'Fragment Mono',monospace;font-size:26px;font-weight:700;color:var(--opc);letter-spacing:5px;flex:1}
.cbcopy{padding:8px 16px;border-radius:20px;border:none;background:var(--p);color:var(--op);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;transition:opacity .2s}
.mbtn:active{opacity:.8}
.slot{display:inline-flex;align-items:center;gap:6px;background:var(--tc);border-radius:8px;padding:6px 12px;font-size:13px;margin-bottom:12px}
.xrow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.xlbl{font-size:13px;color:var(--osv)}
.xval{font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700}
.xbar{height:6px;border-radius:3px;background:var(--s2);overflow:hidden;margin-bottom:12px}
.xfill{height:100%;border-radius:3px;transition:width .5s}
.tlink{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--s1);border-radius:var(--rm);margin-bottom:12px;text-decoration:none;color:var(--p);font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:500}
.tlink:active{background:var(--s2)}
.tl{margin-bottom:12px}
.tlhd{font-size:11px;color:var(--osv);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;font-family:'Plus Jakarta Sans',sans-serif}
.tli{display:flex;gap:12px;padding-bottom:10px;position:relative}
.tli:not(:last-child)::before{content:'';position:absolute;left:11px;top:22px;bottom:0;width:2px;background:var(--olv);border-radius:1px}
.tld{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;z-index:1}
.tld.now{background:var(--p);color:var(--op)}
.tld.old{background:var(--s2);border:2px solid var(--olv);color:var(--osv)}
.tlc{flex:1}
.tlst{font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:600;color:var(--os)}
.tldt{font-size:12px;color:var(--osv);margin-top:1px}
.pacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.act{padding:8px 12px;border-radius:20px;border:1px solid var(--olv);background:transparent;color:var(--osv);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:5px;transition:background .15s;text-decoration:none}
.act:active{background:var(--s2)}
.act.fl{background:var(--pc);border-color:transparent;color:var(--opc)}
.act.gn{background:var(--cdb);border-color:transparent;color:var(--cd)}
.act.rd{background:var(--cfb);border-color:transparent;color:var(--cf)}
.act.sh{background:var(--sc);border-color:transparent;color:var(--s)}
.empty{text-align:center;padding:64px 24px}
.eico{font-size:64px;margin-bottom:16px;opacity:.5}
.etit{font-family:'Plus Jakarta Sans',sans-serif;font-size:22px;font-weight:700;color:var(--ob);margin-bottom:8px}
.esub{font-size:15px;color:var(--osv);line-height:1.6}
.fab{position:fixed;bottom:calc(var(--bot) + 80px);right:20px;width:56px;height:56px;border-radius:18px;background:var(--pc);color:var(--opc);border:none;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:99;transition:all .2s}
.fab:active{transform:scale(.92)}
.toast{position:fixed;bottom:calc(var(--bot) + 160px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--ob);color:var(--bg);padding:12px 20px;border-radius:28px;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:all .3s;white-space:nowrap;max-width:88vw;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* FIX: Bottom Sheet overlay */
.sov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
.sht{background:var(--sf);border-radius:20px 20px 0 0;padding:28px 32px calc(env(safe-area-inset-bottom,0px) + 40px);width:100%;max-width:520px;box-sizing:border-box;max-height:92dvh;overflow-y:auto}
.shnd{width:32px;height:4px;background:var(--olv);border-radius:2px;margin:0 auto 18px;cursor:pointer}
.shtit{font-family:'Bebas Neue',sans-serif!important;font-size:22px!important;letter-spacing:2px!important;color:var(--ob);margin-bottom:18px}
.slbl{font-size:12px;color:var(--osv);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px;font-family:'Plus Jakarta Sans',sans-serif}
.slbl.ft{margin-top:0}
.fin{width:100%;padding:14px 16px;border-radius:var(--rs);border:1px solid var(--olv);background:var(--s1);color:var(--ob);font-family:'Plus Jakarta Sans',sans-serif;font-size:16px;outline:none;transition:border-color .2s;box-sizing:border-box}
.fin:focus{border-color:var(--p);background:var(--sf)}
.fin::placeholder{color:var(--osv)}
.fsel{width:100%;padding:14px 16px;border-radius:var(--rs);border:1px solid var(--olv);background:var(--s1);color:var(--ob);font-family:'Plus Jakarta Sans',sans-serif;font-size:16px;appearance:none;outline:none;box-sizing:border-box}
.row2{display:flex;gap:12px}
.row2>*{flex:1}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.cb{padding:12px 6px;border-radius:var(--rm);border:1px solid var(--olv);background:var(--s1);cursor:pointer;text-align:center;transition:all .2s}
.cb span{font-size:22px;display:block;margin-bottom:4px}
.cb p{font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:500;color:var(--osv)}
.cb.sel{background:var(--pc);border-color:var(--p)}
.cb.sel p{color:var(--opc)}
.cb:active{transform:scale(.96)}
.bfill{width:100%;padding:14px;border-radius:var(--rl);background:var(--p);color:var(--op);border:none;font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .2s;margin-top:8px;box-sizing:border-box}
.bfill:active{opacity:.85}
.bout{width:100%;padding:13px;border-radius:var(--rl);background:transparent;border:1px solid var(--olv);color:var(--osv);font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;margin-top:8px;box-sizing:border-box}
.bdng{width:100%;padding:13px;border-radius:var(--rl);background:transparent;border:1px solid var(--cfb);color:var(--cf);font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;cursor:pointer;margin-top:8px;box-sizing:border-box}
.stabs{display:flex;background:var(--s1);border-radius:12px;padding:4px;gap:4px;margin-bottom:16px}
.stab{flex:1;padding:8px;border-radius:8px;border:none;background:transparent;color:var(--osv);font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s}
.stab.sel{background:var(--sf);color:var(--p);box-shadow:0 1px 3px var(--sh)}
.tpan{display:none}
.tpan.on{display:block}
.srow{background:var(--s1);border-radius:var(--rm);padding:14px;margin-bottom:12px;display:flex;align-items:flex-start;gap:12px}
.sico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.snm{font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:600;color:var(--os)}
.ssub{font-size:12px;color:var(--osv);margin-top:2px}
.sbg{font-size:11px;padding:3px 10px;border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:500}
.bok{background:var(--cdb);color:var(--cd)}
.bwt{background:var(--s2);color:var(--osv)}
.ber{background:var(--cfb);color:var(--cf)}
.pbar{height:4px;background:var(--s2);border-radius:2px;overflow:hidden;margin:8px 0}
.pfil{height:100%;background:var(--p);border-radius:2px;width:0%;transition:width .3s}
.lbox{background:var(--s1);border-radius:var(--rs);padding:12px;font-family:'Fragment Mono',monospace;font-size:11px;color:var(--osv);line-height:1.7;max-height:110px;overflow-y:auto;margin-bottom:8px;white-space:pre-wrap}
.ibox{background:var(--pc);border-radius:var(--rs);padding:12px 14px;font-size:13px;color:var(--opc);line-height:1.6;margin-bottom:12px}
.smsa{width:100%;padding:12px 14px;border-radius:var(--rs);border:1px solid var(--olv);background:var(--s1);color:var(--ob);font-family:'Fragment Mono',monospace;font-size:12px;min-height:90px;resize:vertical;outline:none;box-sizing:border-box}
.smsa:focus{border-color:var(--p)}
.smsa::placeholder{color:var(--osv)}
.cfgr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--olv)}
.cfgd{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cfgl{flex:1;font-size:14px;color:var(--os)}
.cfgi{width:64px;padding:6px 10px;border-radius:8px;border:1px solid var(--olv);background:var(--s1);color:var(--ob);font-family:'Fragment Mono',monospace;font-size:13px;text-align:center;outline:none;box-sizing:border-box}
.cfgi:focus{border-color:var(--p)}
.ci-toggle{width:48px;height:26px;border-radius:13px;background:var(--s2);border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;display:inline-block}
.ci-toggle.on{background:var(--p)}
.ci-toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.ci-toggle.on::after{transform:translateX(22px)}
#fh-dbg{position:fixed;bottom:0;left:0;right:0;height:42vh;background:#0d1117;border-top:2px solid #30363d;z-index:9999;flex-direction:column;font-family:'Fragment Mono',monospace;font-size:11px;color:#c9d1d9;display:none}
.dbg-h{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;background:#161b22;border-bottom:1px solid #30363d;flex-shrink:0}
.dbg-ti{font-weight:bold;color:#58a6ff;font-size:12px}
.dbg-ac{display:flex;gap:6px}
.dbg-b{background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:2px 8px;border-radius:4px;font-size:10px;cursor:pointer}
.dbg-sc{flex:1;overflow-y:auto;padding:2px 0}
.dbg-e{display:flex;gap:6px;padding:2px 10px;border-bottom:1px solid #0d1117;flex-wrap:wrap;align-items:baseline}
.dbg-e:hover{background:#161b22}
.dbg-t{color:#6e7681;flex-shrink:0;font-size:10px}
.dbg-c{font-weight:bold;width:42px;flex-shrink:0;font-size:10px}
.dbg-m{color:#e6edf3;flex:1;min-width:80px}
.dbg-d{color:#8b949e;font-size:10px;width:100%;padding-left:90px;word-break:break-all}
.dbg-ft{padding:3px 10px;background:#161b22;border-top:1px solid #30363d;color:#6e7681;font-size:10px;flex-shrink:0}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fbPulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>

<div id="app">
  <div class="tbar">
    <a href="../index.html" class="ihome">🏠</a>
    <div class="ttl">
      <div class="tlbl">FamilyHub</div>
      <div class="th">📦 Mes colis <span id="totalBadge" style="font-size:14px;font-weight:400;color:var(--osv)"></span></div>
    </div>
    <button id="btn-sync" class="ibtn" data-action="openSync" title="BDD / Sync">⟳<div class="ndot" id="sd" style="display:none"></div><div id="syncDot" style="position:absolute;bottom:6px;right:6px;width:7px;height:7px;border-radius:50%;background:#22c55e;border:1.5px solid var(--bg)"></div></button>
    <button class="ibtn" id="thbtn" data-action="toggleTheme">🌙</button>
  </div>

  <div class="swrap">
    <span class="search-ico">🔍</span>
    <input class="sfield" id="srchIn" placeholder="Rechercher…">
    <button id="srchClr" data-action="clearSearch" style="display:none;position:absolute;right:28px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--osv);font-size:16px;cursor:pointer;padding:4px;border-radius:50%">✕</button>
  </div>

  <div class="chips">
    <button class="chip" data-filter="all" data-action="setFilter">Tous <span class="cn" id="bA">0</span></button>
    <button class="chip sel" data-filter="ready" data-action="setFilter">À retirer <span class="cn" id="bR">0</span></button>
    <button class="chip" data-filter="out_for_delivery" data-action="setFilter">En livraison <span class="cn" id="bO">0</span></button>
    <button class="chip" data-filter="pending" data-action="setFilter">En route <span class="cn" id="bP">0</span></button>
    <button class="chip" data-filter="failed" data-action="setFilter">Échec <span class="cn" id="bF">0</span></button>
    <button class="chip" data-filter="delivered" data-action="setFilter">Récupéré <span class="cn" id="bD">0</span></button>
  </div>

  <div class="plist" id="PL"></div>
</div>

<button id="btn-fab" class="fab" data-action="openAdd">＋</button>
<div class="toast" id="toast"></div>

<div class="sov" id="shAdd">
  <div class="sht">
    <div class="shnd" data-action="closeSheet" data-target="shAdd"></div>
    <div class="shtit">Nouveau colis</div>
    <div class="slbl ft">Transporteur</div>
    <div class="cgrid">
