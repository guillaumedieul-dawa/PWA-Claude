<!-- FIX #1: Dark Mode Toggle (classList bug) -->
<!-- ============================================ -->

<!-- Add this to the click listener section: -->
<script>
document.getElementById('themeToggle')?.addEventListener('click', () => {
  const root = document.documentElement;
  const isDark = root.classList.contains('dark');
  
  // Toggle class
  isDark ? root.classList.remove('dark') : root.classList.add('dark');
  
  // CRITICAL: Force CSS recalc in Capacitor WebView
  root.offsetHeight;
  
  // Save preference
  localStorage.setItem('theme', isDark ? 'light' : 'dark');
});
</script>

<!-- ============================================ -->
<!-- FIX #2 & #3: Filters + Sheets (Event Delegation) -->
<!-- ============================================ -->

<!-- Add this GLOBAL click listener (runs ONCE on page load) -->
<script>
// Helper function for safe target finding
function findAction(elem) {
  while (elem && elem !== document.body) {
    if (elem.dataset?.action) return elem;
    elem = elem.parentElement;
  }
  return null;
}

// Global click dispatcher
document.addEventListener('click', (e) => {
  const actionBtn = findAction(e.target);
  if (!actionBtn) return;
  
  const action = actionBtn.dataset.action;
  
  // FILTER BUTTONS (Fix #2)
  if (action.startsWith('filter-')) {
    const filterType = action.replace('filter-', '');
    
    // Update active state
    document.querySelectorAll('[data-action^="filter-"]').forEach(btn => {
      btn.classList.remove('active');
    });
    actionBtn.classList.add('active');
    
    // Apply filter
    applyColisFilter(filterType);
  }
  
  // SHEET BUTTONS (Fix #3)
  if (action === 'add-colis') {
    openSheet('add-colis-sheet');
  }
  if (action === 'settings') {
    openSheet('settings-sheet');
  }
  if (action === 'close-sheet') {
    const sheetId = actionBtn.closest('.sheet')?.id;
    if (sheetId) closeSheet(sheetId);
  }
});

// Sheet functions
function openSheet(sheetId) {
  const sheet = document.getElementById(sheetId);
  if (!sheet) {
    console.warn('Sheet not found:', sheetId);
    return;
  }
  sheet.style.cssText = 'display: flex; opacity: 1; pointer-events: auto; animation: slideUp 0.3s ease-out;';
}

function closeSheet(sheetId) {
  const sheet = document.getElementById(sheetId);
  if (!sheet) return;
  sheet.style.cssText = 'display: none; opacity: 0; pointer-events: none;';
}

// Make available globally for programmatic calls
window.openSheet = openSheet;
window.closeSheet = closeSheet;
</script>
