<!-- FIX #1: Dark Mode -->
<script>
document.getElementById('themeToggle')?.addEventListener('click', () => {
  const root = document.documentElement;
  root.classList.toggle('dark');
  root.offsetHeight; // CRITICAL
  localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light');
});
</script>

<!-- FIX #2: Navigation (Prev/Next/Suggestions) -->
<script>
let currentMenuDate = new Date();

function findAction(elem) {
  while (elem && elem !== document.body) {
    if (elem.dataset?.action) return elem;
    elem = elem.parentElement;
  }
  return null;
}

document.addEventListener('click', (e) => {
  const btn = findAction(e.target);
  if (!btn) return;
  const action = btn.dataset.action;
  
  // Navigation
  if (action === 'prev-week') {
    currentMenuDate.setDate(currentMenuDate.getDate() - 7);
    renderMenus();
  }
  if (action === 'next-week') {
    currentMenuDate.setDate(currentMenuDate.getDate() + 7);
    renderMenus();
  }
  if (action === 'suggestions') {
    openSheet('suggestions-sheet');
  }
});

function openSheet(id) {
  const sheet = document.getElementById(id);
  if (sheet) sheet.style.cssText = 'display: flex; opacity: 1; animation: slideUp 0.3s;';
}

function closeSheet(id) {
  const sheet = document.getElementById(id);
  if (sheet) sheet.style.cssText = 'display: none; opacity: 0;';
}

window.openSheet = openSheet;
window.closeSheet = closeSheet;
window.currentMenuDate = currentMenuDate;
</script>

<!-- CSS -->
<style>
@keyframes slideUp {
  from { transform: translateY(100%); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
button > span { pointer-events: none; }
</style>
