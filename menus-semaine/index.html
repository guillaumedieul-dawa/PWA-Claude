<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" id="meta-theme" content="#faf7f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Menus">
<title>Menus de la semaine</title>
<link rel="manifest" href="./manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@700&family=Google+Sans+Text:wght@400;500;600&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="themes.css">
<style>
:root { --p: #dc2626; --pc: rgba(220,38,38,.12); --opc: #1c1410; }
.menu-grid { padding: var(--rl); display: flex; flex-direction: column; gap: var(--rm); }
.day-card { background: var(--sf); border: 1px solid var(--olv); border-radius: var(--rm); padding: var(--rm); }
.day-name { font-family: 'Google Sans', sans-serif; font-weight: 700; color: var(--p); margin-bottom: 8px; }
</style>
</head>
<body>

<div class="tbar">
  <a href="index.html" class="ihome">🏠</a>
  <div class="ttl">Menus</div>
  <div class="th"><button class="ibtn" id="thbtn" data-action="toggleTheme">☀️</button></div>
</div>

<div class="menu-grid" id="menuGrid"></div>

<script src="theme.js"></script>
<script>
const days = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
function render() {
  const el = document.getElementById('menuGrid');
  if(!el) return;
  el.innerHTML = days.map(d => `
    <div class="day-card">
      <div class="day-name">${d}</div>
      <div style="color:var(--osv)">Midi : À définir</div>
      <div style="color:var(--osv)">Soir : À définir</div>
    </div>
  `).join('');
}
render();
</script>
</body>
</html>
