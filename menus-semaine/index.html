<style>

:root{--p:#dc2626;--pc:rgba(220,38,38,.12);--opc:#1c1410;--bg:#faf7f2;--sf:#fff;--s1:#f0ebe2;--s2:#e8e2d8;--olv:#e0d9cf;--ob:#1c1410;--os:#1c1410;--osv:#7a6a5a;--sh:rgba(0,0,0,.05);--cf:#9f1239;--cfb:#ffe4e6;--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);--rl:20px;--rm:16px;--rs:12px}
[data-theme="dark"]{--p:#f87171;--bg:#1a1714;--sf:#231e1a;--s1:#2c2620;--s2:#352e27;--olv:#3e352d;--ob:#f0ebe2;--os:#f0ebe2;--osv:#a09080;--sh:rgba(0,0,0,.3);--cf:#fca5a5;--cfb:#450a0a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100dvh;background:var(--bg);color:var(--ob);font-family:'Plus Jakarta Sans',sans-serif;overflow-x:hidden;transition:background .3s,color .3s}
#app{max-width:520px;margin:0 auto;min-height:100dvh;padding-bottom:calc(var(--bot)+96px)}
.tbar{position:sticky;top:0;z-index:100;background:var(--bg);padding:calc(var(--top)+16px) 20px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--olv)}
.ihome{width:36px;height:36px;border-radius:10px;border:none;background:var(--s1);color:var(--os);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;flex-shrink:0}
.ihome:active{background:var(--s2)}
.ttl{flex:1;min-width:0}.tlbl{font-size:10px;color:var(--osv);letter-spacing:.3px;font-weight:500}
.th{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--ob);line-height:1}
.ibtn{width:36px;height:36px;border-radius:10px;border:none;background:var(--s1);color:var(--os);font-size:16px;display:flex;align-items:center;justify-content:center;padding:60px 24px}
.eico{font-size:52px;margin-bottom:12px;opacity:.4}
.etit{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;color:var(--ob);margin-bottom:6px}
.esub{font-size:13px;color:var(--osv)}
.fab{position:fixed;bottom:calc(var(--bot)+28px);right:20px;width:56px;height:56px;border-radius:18px;background:var(--p);color:#fff;border:none;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:28px 36px calc(var(--bot)+40px);max-height:92dvh;overflow-y:auto;box-shadow:0 -4px 24px rgba(0,0,0,.15);box-sizing:border-box;width:100%}
.sht{background:var(--sf);border-radius:20px 20px 0 0;padding:28px 36px calc(var(--bot)+40px);width:100%;max-width:520px;box-sizing:border-box;max-height:92dvh;overflow-y:auto}
.shnd{width:32px;height:4px;background:var(--olv);border-radius:2px;margin:0 auto 16px;cursor:pointer}
.shtit{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;color:var(--ob);margin-bottom:18px}
.slbl{font-size:11px;color:var(--osv);text-transform:uppercase;letter-spacing:.8px;margin:14px 0 6px;font-weight:600}
.slbl.ft{margin-top:0}
.slbl.opt::after{content:' (optionnel)';font-weight:400;text-transform:none;font-size:10px}
.fin{width:100%;padding:13px 16px;border-radius:var(--rs);border:1px solid var(--olv);background:var(--s1);color:var(--ob);font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;outline:none;transition:border-color .2s;margin-bottom:4px}
.fin:focus{border-color:var(--p);background:var(--sf)}
.fin::placeholder{color:var(--osv)}
.fsel{width:100%;padding:13px 16px;border-radius:var(--rs);border:1px solid var(--olv);background:var(--s1);color:var(--ob);font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;appearance:none;outline:none;margin-bottom:4px}
.bfill{width:100%;padding:14px;border-radius:28px;background:var(--p);color:#fff;border:none;font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}
.bfill:active{opacity:.85}
.bout{width:100%;padding:13px;border-radius:28px;background:transparent;border:1px solid var(--olv);color:var(--osv);font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;cursor:pointer;margin-top:8px}
.row2{display:flex;gap:10px}.row2>*{flex:1}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.week-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 12px}
.week-lbl{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;color:var(--ob)}
.wnav-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--olv);background:transparent;color:var(--os);font-size:16px;display:flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:var(--rs);border:1px solid var(--olv);background:var(--s1);color:var(--ob);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;outline:none}
.dedit-in:focus{border-color:var(--p)}
.dedit-in::placeholder{color:var(--osv)}
.dedit-acts{display:flex;gap:8px;margin-top:10px}
.btn-sm{flex:1;padding:10px;border-radius:14px;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .2s;border:none}

.btn-ok:active{opacity:.85}
.btn-cl{background:var(--s2);color:var(--osv);border:1px solid var(--olv)!important}



.dslot-add{font-size:13px;color:var(--p);cursor:pointer;font-style:italic}
.meal-grid{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}

.suggest-btn{width:calc(100% - 32px);margin:0 16px 12px;padding:12px 16px;border-radius:var(--rm);border:1px dashed var(--p);background:rgba(37,99,235,.06);color:var(--p);font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px}
.lvl-btns{display:flex;gap:8px;margin-bottom:16px}

.apply-btn{width:100%;padding:13px;border-radius:28px;background:var(--p);color:#fff;border:none;font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}
.cancel-btn{width:100%;padding:12px;border-radius:28px;border:1px solid var(--olv);background:transparent;color:var(--osv);font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;cursor:pointer;margin-top:6px}

<div class="dlist" id="DL"></div>

<script>
const SK='fh_menus';
const DAYS=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const DAYS_S=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const MONTHS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

function loadD(){try{const d=JSON.parse(localStorage.getItem(SK));if(d)return d;}catch{}return{};}
function saveD(d){localStorage.setItem(SK,JSON.stringify(d));}

let D=loadD();
let weekOffset=0;
let openDay=null;

function getWeekDates(offset=0){
  const now=new Date();
  const day=now.getDay();
  const monday=new Date(now);
  monday.setDate(now.getDate()-((day+6)%7)+offset*7);
  monday.setHours(0,0,0,0);
  return Array.from({length:7},(_,i)=>{
    const d=new Date(monday);d.setDate(monday.getDate()+i);return d;
  });
}

function dayKey(date){return date.toISOString().split('T')[0];}

function renderWeekLabel(dates){
  const a=dates[0],b=dates[6];
  document.getElementById('weekLbl').textContent=
    `${a.getDate()} ${MONTHS[a.getMonth()]} — ${b.getDate()} ${MONTHS[b.getMonth()]}`;
}

function render(){
  const dates=getWeekDates(weekOffset);
  renderWeekLabel(dates);
  const today=dayKey(new Date());
  const el=document.getElementById('DL');
  el.innerHTML=dates.map((date,i)=>{
    const k=dayKey(date);
    const m=D[k]||{};
    const isToday=k===today;
    const isOpen=openDay===k;
    return`<div class="dcard${isToday?' today':''}" id="dc_${k}" style="animation-delay:${i*.04}s">
      <div class="dhdr" onclick="togDay('${k}')">
        <div class="dday">
          ${DAYS[date.getDay()]}
          <span class="dnum">${date.getDate()} ${MONTHS[date.getMonth()]}</span>
        </div>
        <div class="dslots">
          <div class="dslot">
            <div class="dslot-lbl">🌞 Midi</div>
            ${m.midi?`<div class="dslot-val">${m.midi}</div>`:`<div class="dslot-empty">—</div>`}
          </div>
          <div class="dslot">
            <div class="dslot-lbl">🌙 Soir</div>
            ${m.soir?`<div class="dslot-val">${m.soir}</div>`:`<div class="dslot-empty">—</div>`}
          </div>
        </div>
      </div>
      ${isOpen?`<div class="dedit">
        <div class="dedit-row">
          <div class="dedit-lbl">🌞 Repas du midi</div>
          <input class="dedit-in" id="midi_${k}" value="${m.midi||''}" placeholder="Poulet rôti, salade…">
        </div>
        <div class="dedit-row">
          <div class="dedit-lbl">🌙 Repas du soir</div>
          <input class="dedit-in" id="soir_${k}" value="${m.soir||''}" placeholder="Pâtes bolognaise…">
        </div>
        <div class="dedit-row">
          <div class="dedit-lbl">💬 Note</div>
          <input class="dedit-in" id="note_${k}" value="${m.note||''}" placeholder="Invités, régime, rapide…">
        </div>
        <div class="dedit-acts">
          <button class="btn-sm btn-ok" onclick="saveDay('${k}')">✓ Enregistrer</button>
          <button class="btn-sm btn-cl" onclick="togDay('${k}')">Annuler</button>
        </div>
      </div>`:''}
    </div>`;
  }).join('');
}

function togDay(k){
  openDay=openDay===k?null:k;render();
  if(openDay){
    const el=document.getElementById(`midi_${k}`);
    if(el)setTimeout(()=>el.focus(),100);
  }
}

function saveDay(k){
  const midi=(document.getElementById(`midi_${k}`)?.value||'').trim();
  const soir=(document.getElementById(`soir_${k}`)?.value||'').trim();
  const note=(document.getElementById(`note_${k}`)?.value||'').trim();
  if(midi||soir||note)D[k]={midi,soir,note};
  else delete D[k];
  saveD(D);
  fbMenusWrite(k, D[k]||{}).catch(function(){});openDay=null;render();showToast('✓ Menu enregistré');
}

function prevWeek(){weekOffset--;render();}
function nextWeek(){weekOffset++;render();}
function goToday(){weekOffset=0;render();}

let _tt;function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),3000);}
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);document.getElementById('thbtn').textContent=t==='dark'?'🌙':'☀️';}
function toggleTheme(){const d=document.documentElement.getAttribute('data-theme')==='dark';const n=d?'light':'dark';localStorage.setItem('lt_th',n);applyTheme(n);}
function initTheme(){const s=localStorage.getItem('lt_th');if(s){applyTheme(s);return;}const sys=window.matchMedia('(prefers-color-scheme: dark)');applyTheme(sys.matches?'dark':'light');sys.addEventListener('change',e=>{if(!localStorage.getItem('lt_th'))applyTheme(e.matches?'dark':'light');});}

// ── Dispatcher global : gère data-action sans onclick inline ──

function showSuggestSheet(){openSheet('shSuggest');}
function hideSuggestSheet(){closeSheet('shSuggest');}
// ── Init ─────────────────────────────────────────────────────
async function init() {
  document.querySelectorAll('.sov').forEach(function(el){el.style.display='none';});
  document.querySelectorAll('.sov').forEach(function(el){el.style.display='none';});
  initTheme(); render();
  // Firestore source primaire : hydratation silencieuse au démarrage
  try {
    const remote = await fbMenusReadAll();
    let changed = false;
    for (const k in remote) {
      if (!D[k] || JSON.stringify(D[k]) !== JSON.stringify(remote[k])) {
        D[k] = Object.assign(D[k]||{}, remote[k]);
        changed = true;
      }
    }
    if (changed) { saveD(D); render(); }
  } catch(e) { /* réseau indisponible, fallback local */ }
}
init();


var MEALS={
  classique:{
    midi:['Poulet rôti','Steak frites','Saumon grillé','Quiche lorraine','Côtes de porc','Pot-au-feu','Rôti de bœuf'],
    soir:['Pâtes bolognaise','Pizza maison','Soupe et tartines','Omelette','Gratin dauphinois','Blanquette de veau','Risotto']
  },
  vegetarien:{
    midi:['Quiche légumes','Curry pois chiches','Salade composée','Tartelettes chèvre','Buddha bowl','Soupe minestrone','Gratin courgettes'],
    soir:['Pasta primavera','Galettes de légumes','Soupe potiron','Tarte aux poireaux','Falafels','Wok de tofu','Lentilles']
  },
  enfants:{
    midi:['Nuggets frites','Pizza margherita','Spaghettis bolo','Croque-monsieur','Poisson pané purée','Hamburger maison','Hot-dogs crudités'],
    soir:['Pâtes fromage','Crêpes','Soupe légumes','Jambon baguette','Mac and cheese','Nuggets riz','Saucisse purée']
  }
};
var _suggestLvl='classique';
function showSuggest(){
  updateMealPreview();
  document.getElementById('shSuggest').classList.add('on');
}
function updateMealPreview(){
  var m=MEALS[_suggestLvl];
  var dates=getWeekDates(weekOffset);
  var days=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  var html=dates.map(function(d,i){
    return '<div class="meal-item"><span>'+days[i]+' - Midi</span><span style="font-weight:600">'+m.midi[i%7]+'</span></div>'+
           '<div class="meal-item"><span>'+days[i]+' - Soir</span><span style="font-weight:600">'+m.soir[i%7]+'</span></div>';
  }).join('');
  document.getElementById('meal-grid').innerHTML=html;
}
function applySuggest(){
  var m=MEALS[_suggestLvl];
  var dates=getWeekDates(weekOffset);
  dates.forEach(function(d,i){
    D[dayKey(d)]={midi:m.midi[i%7],soir:m.soir[i%7],note:''};
  });
  saveD(D);
  document.getElementById('shSuggest').classList.remove('on');
  render();
  showToast('✓ Repas appliqués pour la semaine');
}

// ── Synchronisation Firestore pour les menus ────────────────────
const FB_MENUS = { projectId: 'familyhub-colis-8abbd' };
const MENUS_COLL = 'meta/menus';
function getFBKeyM() {
  try { const s = JSON.parse(localStorage.getItem('lt_fb')); return s && s.apiKey ? s.apiKey : ''; } catch { return ''; }
}
function fbMenusUrl(path) {
  return 'https://firestore.googleapis.com/v1/projects/' + FB_MENUS.projectId +
    '/databases/(default)/documents/' + path + '?key=' + getFBKeyM();
}

async function fbMenusWrite(dateKey, data) {
  if (!getFBKeyM()) return;
  try {
    const fields = {};
    for (const k in data) { fields[k] = {stringValue: String(data[k]||'')}; }
    await fetch(fbMenusUrl(MENUS_COLL + '/' + dateKey), {
      method: 'PATCH',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({fields})
    });
  } catch(e) { console.warn('fbMenusWrite', e); }
}

async function fbMenusReadAll() {
  if (!getFBKeyM()) return {};
  try {
    const r = await fetch(fbMenusUrl(MENUS_COLL));
    if (!r.ok) return {};
    const data = await r.json();
    const result = {};
    (data.documents||[]).forEach(function(doc) {
      const parts = doc.name.split('/');
      const dateKey = parts[parts.length-1];
      const fields = doc.fields||{};
      result[dateKey] = {};
      for (const k in fields) { result[dateKey][k] = fields[k].stringValue||''; }
    });
    return result;
  } catch(e) { console.warn('fbMenusReadAll', e); return {}; }
}

async function syncMenus() {
  showToast('🔄 Synchronisation…');
  try {
    const remote = await fbMenusReadAll();
    let changed = false;
    for (const k in remote) {
      if (!D[k] || JSON.stringify(D[k]) !== JSON.stringify(remote[k])) {
        D[k] = Object.assign(D[k]||{}, remote[k]);
        changed = true;
      }
    }
    if (changed) { saveD(D); render(); }
    showToast('✓ Menus synchronisés');
  } catch(e) { showToast('❌ Sync échouée'); }
}
</script>

  <div class="sht">

<script>

(function(){
  function on(id,fn){var e=document.getElementById(id);if(e)e.addEventListener('click',fn,false);}
  on('thbtn',function(){toggleTheme();});
  on('btn-suggest',function(){showSuggest();});
  on('btn-apply-sug',function(){applySuggest();});
  on('btn-cancel-sug',function(){document.getElementById('shSuggest').classList.remove('on');});
  on('shnd-sug',function(){document.getElementById('shSuggest').classList.remove('on');});
  ['lvl-c','lvl-v','lvl-e'].forEach(function(id){
    on(id,function(){
      _suggestLvl=document.getElementById(id).dataset.lvl;
      document.querySelectorAll('.lvl-btn').forEach(function(b){b.classList.remove('sel');});
      document.getElementById(id).classList.add('sel');
      updateMealPreview();
    });
  });
  var bp=document.querySelector('.wnav-btn:first-of-type');if(bp)bp.addEventListener('click',function(){prevWeek();},false);
  var bn=document.querySelector('.wnav-btn:last-of-type');if(bn)bn.addEventListener('click',function(){nextWeek();},false);
  var bt=document.querySelector('.week-today');if(bt)bt.addEventListener('click',function(){goToday();},false);
  document.querySelectorAll('.sov').forEach(function(s){
    s.addEventListener('click',function(e){if(e.target===s)s.classList.remove('on');},false);
  });
  var _R=render;
  render=function(){
    _R();
    document.querySelectorAll('.dcard[id]').forEach(function(card){
      if(card._h)return;card._h=1;
      var k=card.id.replace('dc_','');
      var hdr=card.querySelector('.dhdr');
      if(hdr)hdr.addEventListener('click',function(){togDay(k);},false);
      var sv=card.querySelector('.btn-ok');
      if(sv)sv.addEventListener('click',function(){saveDay(k);},false);
      var cn=card.querySelector('.btn-cl');
      if(cn)cn.addEventListener('click',function(){togDay(k);},false);
    });
  };
})();

</script>

<script>
/* ── Sheets : mutualisé Capacitor WebView ── */
function openSheet(id){
  var el=document.getElementById(id);
  if(!el)return;
  el.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;;padding:0 20px'
  try{document.body.style.overflow='hidden';}catch(e){}
}
function closeSheet(id){
  var el=document.getElementById(id);
  if(!el)return;
  el.style.display='none';
  try{document.body.style.overflow='';}catch(e){}
}
document.querySelectorAll('.sov').forEach(function(sov){
  sov.addEventListener('click',function(e){if(e.target===sov)closeSheet(sov.id);},false);
});
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(r => console.log('SW enregistré', r.scope))
      .catch(e => console.warn('SW erreur', e));
  });
}
</script>
