<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f8fb">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1c1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To-Do">
<title>To-Do partagé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--p:#0057A8;--op:#FFF;--pc:#D7E3FF;--opc:#001849;--bg:#F4F8FB;--sf:#FFF;--s1:#EDF1F4;--s2:#E6EBF0;--s3:#DEE4EA;--ol:#72787E;--olv:#C2C8CF;--ob:#1A1C1E;--os:#1A1C1E;--osv:#42474C;--sh:rgba(0,0,0,0.08);--cr:#1A6500;--crb:#C4EFAD;--cd:#0A5C00;--cdb:#B7F397;--cf:#93000A;--cfb:#FFDAD6;--cpd:#7B4F00;--cpdb:#FFDDB4;--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);--rl:28px;--rm:16px;--rs:12px}
[data-theme="dark"]{--p:#ADC6FF;--op:#002E6C;--pc:#00429A;--opc:#D7E3FF;--bg:#1A1C1E;--sf:#1A1C1E;--s1:#252729;--s2:#2C2F31;--s3:#333639;--ol:#8C9198;--olv:#42474C;--ob:#E3E2E6;--os:#E3E2E6;--osv:#C2C7CE;--sh:rgba(0,0,0,0.3);--cr:#A7D689;--crb:#1E3A10;--cd:#94DA79;--cdb:#113800;--cf:#FFB4AB;--cfb:#410002;--cpd:#FFB95D;--cpdb:#3E2800}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100dvh;background:var(--bg);color:var(--ob);font-family:'Google Sans Text',sans-serif;overflow-x:hidden;transition:background .3s,color .3s}
#app{max-width:520px;margin:0 auto;min-height:100dvh;padding-bottom:calc(var(--bot)+96px)}
.tbar{position:sticky;top:0;z-index:100;background:var(--bg);padding:calc(var(--top)+12px) 16px 8px;display:flex;align-items:center;gap:8px}
.ihome{width:40px;height:40px;border-radius:50%;border:none;background:var(--s1);color:var(--os);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;flex-shrink:0}
.ihome:active{background:var(--s2)}
.ttl{flex:1;min-width:0}
.tlbl{font-size:11px;color:var(--osv);letter-spacing:.3px}
.th{font-family:'Google Sans',sans-serif;font-size:22px;font-weight:700;color:var(--ob);letter-spacing:-.3px;line-height:1.1}
.ibtn{width:40px;height:40px;border-radius:50%;border:none;background:var(--s1);color:var(--os);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;position:relative}
.ibtn:active{background:var(--s2)}
/* Chips */
.chips{display:flex;gap:8px;padding:8px 16px 12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 14px;border-radius:8px;border:1px solid var(--olv);background:transparent;color:var(--osv);font-family:'Google Sans Text',sans-serif;font-size:13px;cursor:pointer;white-space:nowrap;transition:all .2s}
.chip.sel{background:var(--pc);border-color:var(--pc);color:var(--opc);font-weight:500}
/* Quick add */
.qadd{display:flex;gap:10px;padding:0 16px 12px;align-items:center}
.qadd-in{flex:1;padding:12px 16px;border-radius:28px;border:1px solid var(--olv);background:var(--sf);color:var(--ob);font-family:'Google Sans Text',sans-serif;font-size:15px;outline:none;transition:border-color .2s}
.qadd-in:focus{border-color:var(--p)}
.qadd-in::placeholder{color:var(--osv)}
.qadd-btn{width:44px;height:44px;border-radius:50%;border:none;background:var(--p);color:var(--op);font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.qadd-btn:active{opacity:.8}
/* Task list */
.tlist{padding:0 12px;display:flex;flex-direction:column;gap:6px}
/* Task card */
.task{background:var(--sf);border-radius:var(--rm);padding:14px 16px;display:flex;align-items:flex-start;gap:12px;box-shadow:0 1px 2px var(--sh);border:1px solid transparent;transition:all .2s;cursor:pointer}
.task:active{transform:scale(.99)}
.task.done{opacity:.55}
.task.done .task-text{text-decoration:line-through;color:var(--osv)}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--olv);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;margin-top:1px}
.chk.done{background:var(--p);border-color:var(--p)}
.task-body{flex:1;min-width:0}
.task-text{font-size:15px;color:var(--os);line-height:1.4;word-break:break-word}
.task-meta{display:flex;align-items:center;gap:8px;margin-top:5px}
.task-who{font-size:11px;font-weight:600;font-family:'Google Sans',sans-serif}
.task-date{font-size:11px;color:var(--osv);font-family:'Roboto Mono',monospace}
.task-prio{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.task-del{padding:4px 6px;border-radius:8px;border:none;background:transparent;color:var(--osv);font-size:14px;cursor:pointer;opacity:.6;flex-shrink:0}
.task-del:active{opacity:1;color:var(--cf)}
/* Priority legend */
.prio-row{display:flex;gap:12px;padding:4px 16px 12px;align-items:center}
.prio-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--osv)}
.prio-dot{width:10px;height:10px;border-radius:50%}
/* Empty */
.empty{text-align:center;padding:60px 24px}
.eico{font-size:56px;margin-bottom:12px;opacity:.5}
.etit{font-family:'Google Sans',sans-serif;font-size:20px;font-weight:700;color:var(--ob);margin-bottom:6px}
.esub{font-size:14px;color:var(--osv)}
/* FAB */
.fab{position:fixed;bottom:calc(var(--bot)+28px);right:20px;width:56px;height:56px;border-radius:18px;background:var(--pc);color:var(--opc);border:none;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px var(--sh);z-index:49;transition:all .2s}
.fab:active{transform:scale(.92)}
/* Toast */
.toast{position:fixed;bottom:calc(var(--bot)+100px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--ob);color:var(--bg);padding:12px 20px;border-radius:28px;font-family:'Google Sans',sans-serif;font-size:14px;font-weight:500;z-index:999;opacity:0;transition:all .3s;white-space:nowrap;max-width:88vw;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Sheet */
.sov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}

.sht{background:var(--sf);border-radius:28px 28px 0 0;padding:12px 24px calc(var(--bot)+24px);width:100%;max-width:520px;max-height:92dvh;overflow-y:auto}
.sov.on .sht{}
.shnd{width:32px;height:4px;background:var(--olv);border-radius:2px;margin:0 auto 18px;cursor:pointer}
.shtit{font-family:'Google Sans',sans-serif;font-size:20px;font-weight:700;color:var(--ob);margin-bottom:18px}
.slbl{font-size:12px;color:var(--osv);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px;font-family:'Google Sans',sans-serif}
.slbl.ft{margin-top:0}
.fin{width:100%;padding:14px 16px;border-radius:var(--rs);border:1px solid var(--olv);background:var(--s1);color:var(--ob);font-family:'Google Sans Text',sans-serif;font-size:16px;outline:none;transition:border-color .2s;margin-bottom:4px}
.fin:focus{border-color:var(--p);background:var(--sf)}
.fin::placeholder{color:var(--osv)}
.fsel{width:100%;padding:14px 16px;border-radius:var(--rs);border:1px solid var(--olv);background:var(--s1);color:var(--ob);font-family:'Google Sans Text',sans-serif;font-size:16px;appearance:none;outline:none}
.bfill{width:100%;padding:14px;border-radius:var(--rl);background:var(--p);color:var(--op);border:none;font-family:'Google Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}
.bfill:active{opacity:.85}
.bout{width:100%;padding:13px;border-radius:var(--rl);background:transparent;border:1px solid var(--olv);color:var(--osv);font-family:'Google Sans',sans-serif;font-size:15px;cursor:pointer;margin-top:8px}
/* Prio buttons */
.prio-btns{display:flex;gap:8px;margin-bottom:8px}
.pbtn{flex:1;padding:10px;border-radius:var(--rs);border:1px solid var(--olv);background:var(--s1);cursor:pointer;text-align:center;font-family:'Google Sans',sans-serif;font-size:12px;font-weight:500;color:var(--osv);transition:all .2s}
.pbtn.sel{border-width:2px}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.task{animation:fu .25s ease both}
</style>
</head>
<body>
<div id="app">
  <div class="tbar">
    <a href="../index.html" class="ihome">🏠</a>
    <div class="ttl">
      <div class="tlbl">FamilyHub</div>
      <div class="th">✅ To-Do partagé</div>
    </div>
    <button class="ibtn" id="thbtn" onclick="toggleTheme()">🌙</button>
  </div>

  <div class="qadd">
    <input class="qadd-in" id="qi" placeholder="Ajouter une tâche…" onkeydown="if(event.key==='Enter')quickAdd()">
    <button class="qadd-btn" onclick="quickAdd()">＋</button>
  </div>

  <div class="chips">
    <button class="chip sel" data-filter="all" onclick="setFlt('all',this)">Toutes <span id="bA">0</span></button>
    <button class="chip" data-filter="todo" onclick="setFlt('todo',this)">À faire <span id="bT">0</span></button>
    <button class="chip" data-filter="done" onclick="setFlt('done',this)">Terminées <span id="bD">0</span></button>
    <button class="chip" data-filter="g" onclick="setFlt('g',this)">Guillaume</button>
    <button class="chip" data-filter="m" onclick="setFlt('m',this)">Michèle</button>
  </div>

  <div class="tlist" id="TL"></div>
</div>

<button class="fab" onclick="openAdd()">＋</button>
<div class="toast" id="toast"></div>

<!-- Sheet ajout détaillé -->
<div class="sov" id="shAdd">
  <div class="sht">
    <div class="shnd" onclick="closeS('shAdd')"></div>
    <div class="shtit">Nouvelle tâche</div>
    <div class="slbl ft">Tâche</div>
    <input class="fin" id="aText" placeholder="Que faut-il faire ?">
    <div class="slbl">Priorité</div>
    <div class="prio-btns">
      <button class="pbtn sel" id="pb-low" data-prio="low" onclick="selPri('low',this)" style="border-color:#C4EFAD;background:#C4EFAD20;color:#1A6500">🟢 Basse</button>
      <button class="pbtn" id="pb-mid" data-prio="mid" onclick="selPri('mid',this)" style="border-color:#FFDDB4">🟡 Moyenne</button>
      <button class="pbtn" id="pb-high" data-prio="high" onclick="selPri('high',this)" style="border-color:#FFDAD6">🔴 Haute</button>
    </div>
    <div class="slbl">Assigné à</div>
    <select class="fsel" id="aWho" style="margin-bottom:8px">
      <option value="Guillaume">Guillaume</option>
      <option value="Michele">Michèle</option>
      <option value="Tous">Tous les deux</option>
    </select>
    <div class="slbl">Note (optionnel)</div>
    <input class="fin" id="aNote" placeholder="Détails…">
    <button class="bfill" onclick="addTask()">Enregistrer</button>
    <button class="bout" onclick="closeS('shAdd')">Annuler</button>
  </div>
</div>

<script>
const SK='fh_todo';
const PRIO_COLORS={high:'#cf0000',mid:'#7B4F00',low:'#1A6500'};
const PRIO_BG={high:'#FFDAD6',mid:'#FFDDB4',low:'#C4EFAD'};

function loadD(){try{const d=JSON.parse(localStorage.getItem(SK));if(d?.tasks)return d;}catch{}return{tasks:[],nextId:1};}
function saveD(d){localStorage.setItem(SK,JSON.stringify(d));}

let D=loadD(),flt='all',prio='low';

function quickAdd(){
  const v=document.getElementById('qi').value.trim();
  if(!v)return;
  D.tasks.unshift({id:D.nextId++,text:v,done:false,prio:'mid',who:'Tous',note:'',date:new Date().toISOString()});
  saveD(D);render();document.getElementById('qi').value='';
  showToast('✓ Tâche ajoutée');
}

function selPrio(p,el){
  prio=p;
  document.querySelectorAll('.pbtn').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel');
}

function addTask(){
  const text=document.getElementById('aText').value.trim();
  if(!text){showToast('⚠️ Saisissez une tâche');return;}
  D.tasks.unshift({
    id:D.nextId++,text,done:false,
    prio,who:document.getElementById('aWho').value,
    note:document.getElementById('aNote').value.trim(),
    date:new Date().toISOString()
  });
  saveD(D);render();closeS('shAdd');showToast('✓ Tâche ajoutée');
  ['aText','aNote'].forEach(id=>document.getElementById(id).value='');
}

function toggleDone(id){
  const t=D.tasks.find(x=>x.id===id);if(!t)return;
  t.done=!t.done;t.doneAt=t.done?new Date().toISOString():null;
  saveD(D);render();
  showToast(t.done?'✓ Tâche terminée':'↩ Tâche réactivée');
}

function delTask(id,e){
  e.stopPropagation();
  D.tasks=D.tasks.filter(t=>t.id!==id);
  saveD(D);render();
}

function getFilt(){
  let tasks=[...D.tasks];
  if(flt==='todo')tasks=tasks.filter(t=>!t.done);
  else if(flt==='done')tasks=tasks.filter(t=>t.done);
  else if(flt==='g')tasks=tasks.filter(t=>t.who==='Guillaume'||t.who==='Tous');
  else if(flt==='m')tasks=tasks.filter(t=>t.who==='Michele'||t.who==='Tous');
  return tasks.sort((a,b)=>{
    if(a.done!==b.done)return a.done?1:-1;
    const po={high:0,mid:1,low:2};
    return(po[a.prio]||1)-(po[b.prio]||1);
  });
}

function fmtDate(iso){
  if(!iso)return'';
  const d=new Date(iso);
  const now=new Date();
  if(d.toDateString()===now.toDateString())return'Aujourd\'hui '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
}

function render(){
  const tasks=getFilt();
  const all=D.tasks;
  document.getElementById('bA').textContent=all.length;
  document.getElementById('bT').textContent=all.filter(t=>!t.done).length;
  document.getElementById('bD').textContent=all.filter(t=>t.done).length;
  const el=document.getElementById('TL');
  if(!tasks.length){
    el.innerHTML=`<div class="empty"><div class="eico">✅</div><div class="etit">${flt==='done'?'Aucune tâche terminée':'Tout est fait !'}</div><div class="esub">Appuyez sur + pour ajouter une tâche</div></div>`;return;
  }
  el.innerHTML=tasks.map((t,i)=>`
    <div class="task${t.done?' done':''}" data-action="toggleDone" data-id="${t.id}" style="animation-delay:${i*.03}s">
      <div class="chk${t.done?' done':''}">${t.done?'<span style="color:#fff;font-size:13px">✓</span>':''}</div>
      <div class="task-body">
        <div class="task-text">${t.text}</div>
        ${t.note?`<div style="font-size:12px;color:var(--osv);margin-top:3px">${t.note}</div>`:''}
        <div class="task-meta">
          <span class="task-who" style="color:${t.who==='Michele'?'#6B5E91':t.who==='Guillaume'?'#0057A8':'#006875'}">${t.who==='Michele'?'M':t.who==='Guillaume'?'G':'G+M'}</span>
          <span class="task-date">${fmtDate(t.done?t.doneAt:t.date)}</span>
        </div>
      </div>
      <div class="task-prio" style="background:${PRIO_COLORS[t.prio]||PRIO_COLORS.mid}"></div>
      <button class="task-del" data-action="delTask" data-id="${t.id}">🗑</button>
    </div>`).join('');
}

function setF(f,btn){flt=f;document.querySelectorAll('.chip').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel');render();}


document.querySelectorAll('.sov').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)closeS(o.id);}));
let _tt;function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),3000);}
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);document.getElementById('thbtn').textContent=t==='dark'?'🌙':'☀️';}
function toggleTheme(){const d=document.documentElement.getAttribute('data-theme')==='dark';const n=d?'light':'dark';localStorage.setItem('lt_th',n);applyTheme(n);}
function initTheme(){const s=localStorage.getItem('lt_th');if(s){applyTheme(s);return;}const sys=window.matchMedia('(prefers-color-scheme: dark)');applyTheme(sys.matches?'dark':'light');sys.addEventListener('change',e=>{if(!localStorage.getItem('lt_th'))applyTheme(e.matches?'dark':'light');});}

// ── Dispatcher global : gère data-action sans onclick inline ──


function setFlt(f,btn){flt=f;document.querySelectorAll('.chip').forEach(function(b){b.classList.remove('sel');});if(btn)btn.classList.add('sel');render();}
function selPri(p,btn){prio=p;document.querySelectorAll('.pbtn').forEach(function(b){b.classList.remove('sel');});if(btn)btn.classList.add('sel');}
// Masquer toutes les sheets au démarrage
document.querySelectorAll('.sov').forEach(function(el){el.style.display='none';});
function openAdd(){openSheet('shAdd');}

function closeS(id){closeSheet(id);}
function openS(id){openSheet(id);}
initTheme();
(function(){
  var _R=render;
  render=function(){
    _R();
    document.querySelectorAll('.task[data-id]').forEach(function(card){
      if(card._b)return;card._b=1;
      var tid=parseInt(card.dataset.id||0);
      card.setAttribute('onclick','toggleDone('+tid+')');
      var d=card.querySelector('.task-del');
      if(d)d.setAttribute('onclick','event.stopPropagation();delTask('+tid+',event)');
    });
  };
})();
render();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(r => console.log('SW enregistré', r.scope))
      .catch(e => console.warn('SW erreur', e));
  });
}
</script>


<script>
/* ── Sheets : mutualisé Capacitor WebView ── */
function openSheet(id){
  var el=document.getElementById(id);
  if(!el)return;
  el.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;';
  try{document.body.style.overflow='hidden';}catch(e){}
}
function closeSheet(id){
  var el=document.getElementById(id);
  if(!el)return;
  el.style.display='none';
  try{document.body.style.overflow='';}catch(e){}
}
document.querySelectorAll('.sov').forEach(function(sov){
  sov.addEventListener('click',function(e){if(e.target===sov)closeSheet(sov.id);},false);
});
</script>
</body>
</html>
