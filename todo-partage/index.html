<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" id="meta-theme" content="#faf7f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To-Do">
<title>To-Do partagé</title>
<link rel="manifest" href="./manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@700&family=Google+Sans+Text:wght@400;500;600&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="themes.css">
<style>
:root { --p: #7c3aed; --pc: #ede9fe; --opc: #2e1065; }
.task-list { padding: var(--rl); display: flex; flex-direction: column; gap: var(--rs); }
.task-card { background: var(--sf); border: 1px solid var(--olv); border-radius: var(--rs); padding: var(--rm); display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 3px var(--sh); }
.task-main { display: flex; align-items: center; gap: 12px; }
.task-title { font-size: 16px; font-weight: 500; color: var(--ob); }
.task-card.done .task-title { text-decoration: line-through; color: var(--osv); }
</style>
</head>
<body>

<div class="tbar">
  <a href="index.html" class="ihome">🏠</a>
  <div class="ttl">To-Do partagé</div>
  <div class="th"><button class="ibtn" id="thbtn" data-action="toggleTheme">☀️</button></div>
</div>

<div class="task-list" id="taskList"></div>

<script src="theme.js"></script>
<script>
let D = { tasks: [] };
function render() {
  const el = document.getElementById('taskList');
  if(!el) return;
  el.innerHTML = D.tasks.map(t => `
    <div class="task-card ${t.done ? 'done' : ''}">
      <div class="task-main">
        <input type="checkbox" ${t.done ? 'checked' : ''} onclick="toggleDone(${t.id})">
        <span class="task-title">${t.title}</span>
      </div>
    </div>
  `).join('');
}
function toggleDone(id) {
  const t = D.tasks.find(x => x.id === id);
  if(t) { t.done = !t.done; render(); }
}
async function init() { render(); }
init();
</script>
</body>
</html>
